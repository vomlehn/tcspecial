# The Python a ground station is built on -- tcslib_protocol, tcslib_moc and
# tcs_ui -- as one distribution, so that `pip install ./python` installs all
# three.
#
# Named tcspecial-moc, as the system package that carries them is, and
# not after any one of the three: the import names are the crates' own and
# stay so, but a distribution called tcslib_moc would be one name on PyPI away
# from somebody else's.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tcspecial-moc"
# The workspace's version, [workspace.package] in ../Cargo.toml.
# tests/test_version.py fails when the two differ.
version = "0.1.0"
description = """\
The Python spelling of tcspecial's ground libraries: beacons, \
configurations and the beacon panel"""
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "David VomLehn", email = "dvomlehn@gmail.com" }]
requires-python = ">=3.9"
# Nothing outside the standard library is needed to import any of them. A
# YAML configuration is read with PyYAML, imported only when one is read, so
# it is an extra rather than a requirement; tcs_ui needs tkinter, which is
# part of the standard library but packaged on its own by most
# distributions, and is not something pip can install.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML"]

[tool.setuptools]
# Named rather than found: tcslib_protocol._xtce is a directory of links, which
# package discovery does not follow, and tests/ is not to be installed.
packages = ["tcslib_protocol", "tcslib_protocol._xtce", "tcslib_moc", "tcs_ui"]

[tool.setuptools.package-data]
# The XTCE documents the interface digest is taken over: see
# tcslib_protocol/interface.py. The configuration schema, whose lists of node
# types a configuration is read against: see tcslib_protocol/configuration.py.
# And the part of a Yamcs mission database no configuration changes: see
# tcslib_protocol/yamcs.py; and the Yamcs server's and instance's configurations
# a ground station fills in: see tcslib_moc/yamcs_ground.py.
tcslib_protocol = ["xtce/*.xtce", "schema/tcspecial.schema.json", "yamcs.xtce"]
tcslib_moc = ["yamcs-templates/*.in"]
