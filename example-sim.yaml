# yaml-language-server: $schema=tcsprotocol/schema/tcspecial-sim.schema.json

# How tcs-sim simulates the one payload of example.ytcs.
#
# There is no SPI device to open on most hosts, so spi-1 gives a sim_address
# address in example.ytcs: under --simulate=some or all tcspecial reads it
# there over UDP, and tcs-sim answers there.
description: Simulator settings for the payload of example.ytcs

# Where tcs-sim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcs-sim:
  ready: "127.0.0.1:7900"

simulated_payloads:
  - type spi:
      # One packet a second.
      - payload: spi-1
        packet_interval: 1 s
        simulate: true
