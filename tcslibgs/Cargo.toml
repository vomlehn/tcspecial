[package]
name = "tcslibgs"
version = "0.1.0"
edition = "2021"
description = "TCSpecial ground/space shared library - contains command, telemetry, and type definitions"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
serde_norway = "0.9.42"
quick-xml = { version = "0.42", features = ["serialize"] }
