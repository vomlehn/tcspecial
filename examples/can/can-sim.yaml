# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of can.ytcs.
description: Simulator settings for the payloads of can.ytcs

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7909"

# tcssim joins the bus as one more member, as the motor would: it sends the
# status frames and counts the command frames, each by its identifier. It
# makes no bus. vcan0 has to be up before it starts, which
# bin/mk-kernel-stand-ins sees to.
simulated_payloads:
  # A status frame a second.
  - name: motor_status
    simulate: true
    type: can
    packet_interval: 1 s
  # Driven and never read: its stand-in sends nothing and counts what the
  # vehicle sends it, so that its panel shows each command reaching it.
  - name: motor_command
    simulate: true
    type: can
