[workspace]
resolver = "2"

members = [
    "tcslibgs",
    "tcslib",
    "tcspecial",
    "tcsmoc",
    "tcssim",
    "tcsverify",
    "tcsgui",
    # The file interfaces an app node's program is run with, and the five
    # apps that are run over them: see tcsapp. Three are nodes of the
    # vehicle's own and two are payloads.
    "tcsapp",
    "app_payload_veh",
    "app_moc_veh",
    "app_all_veh",
    "app_pl",
    "app_all_pl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TCSpecial Team"]
license = "MIT"
#log = "0.4"
#env_logger = "0.10"
