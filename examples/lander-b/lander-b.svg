  <text class="heading" x="420" y="40">VEHICLE: lander-b</text>
  <text class="heading" x="820" y="40">GATEWAY, TO YAMCS</text>
  <text class="kind" x="420" y="62">solid: data; dashed: the joystick driving the thrust</text>
  <rect class="payload" x="40" y="90" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="112">accel_y</text>
  <text class="kind" x="52" y="130">payload, network</text>
  <text class="detail" x="52" y="146">127.0.0.24:20803</text>
  <rect class="payload" x="40" y="176" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="198">crashed</text>
  <text class="kind" x="52" y="216">payload, network</text>
  <text class="detail" x="52" y="232">127.0.0.24:20807</text>
  <rect class="payload" x="40" y="262" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="284">joystick_3_4_y</text>
  <text class="kind" x="52" y="302">payload, network</text>
  <text class="detail" x="52" y="318">127.0.0.24:20804</text>
  <rect class="payload" x="40" y="348" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="370">landed</text>
  <text class="kind" x="52" y="388">payload, network</text>
  <text class="detail" x="52" y="404">127.0.0.24:20806</text>
  <rect class="payload" x="40" y="434" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="456">ratings</text>
  <text class="kind" x="52" y="474">payload, network</text>
  <text class="detail" x="52" y="490">127.0.0.24:20809</text>
  <rect class="payload" x="40" y="520" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="542">restart</text>
  <text class="kind" x="52" y="560">payload, network</text>
  <text class="detail" x="52" y="576">127.0.0.24:20808</text>
  <rect class="payload" x="40" y="606" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="628">thruster_y</text>
  <text class="kind" x="52" y="646">payload, network</text>
  <text class="detail" x="52" y="662">127.0.0.24:20805</text>
  <rect class="payload" x="40" y="692" width="250" height="64" rx="8"/>
  <text class="name" x="52" y="714">velocity_y</text>
  <text class="kind" x="52" y="732">payload, network</text>
