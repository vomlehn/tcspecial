# What each directory of tcspecial is, by the TCS code categories: see
# "Code categories" in tcs-helpers' README. A directory stands for
# everything under it but a longer path listed, and a file at the top is
# infrastructure. make operational-names holds this to the files git
# tracks, and to the names of the crates and Python packages in each.

[categories]
# What flies, and what the MOC is built on.
operational = [
	"tcspecial",
	"tcsprotocol",
	"tcsmoc",
	"tcsmoc-c",
	"tcsverify",
	"tcsapp",
	"python/tcsprotocol",
	"python/tcsmoc",
]

# What writes and checks configurations, and what draws them.
software-tools = [
	"tcs-cfge",
	"tcs-verify",
	"tcs-conflict",
	"tcs-diagram",
	"tcs-ui",
	"tools/convert-format.py",
]

# What stands in for the payloads and the MOC, the test apps, the kernel's
# dummy devices, the test container, and every test. cfs/ and fprime/ are
# cFS's and F´'s software, generated or not, used only to test tcspecial
# beside them: it is not TCS software, is never counted as such, and is
# listed here only so that every directory is in a category.
verification-tools = [
	"tcs-sim",
	"tcs-moc",
	"app_pl",
	"app_all_pl",
	"app_payload_veh",
	"app_gateway_veh",
	"app_all_veh",
	"bin",
	"cfs",
	"container",
	"fprime",
	"tests",
	"python/tests",
	"*/tests",
]

# What builds, packages, documents and checks the rest.
infrastructure = [
	".cargo",
	".claude",
	".github",
	"bin/install-tools",
	"docs",
	"packaging",
	"python",
	"tools/ntss.py",
]

# The shipped examples, and the guide's lander, built a stage at a time.
examples = [
	"examples",
	"docs/building-a-vehicle",
]
