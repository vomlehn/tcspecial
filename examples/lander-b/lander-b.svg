  <text class="kind" x="432" y="130">compute</text>
  <text class="detail" x="432" y="146">to_value, metre_per_second_squared</text>
  <rect class="vehicle" x="420" y="176" width="250" height="64" rx="8"/>
  <text class="name" x="432" y="198">to_joystick_3_4_y</text>
  <text class="kind" x="432" y="216">compute</text>
  <text class="detail" x="432" y="232">to_value, ratio</text>
  <rect class="vehicle" x="420" y="262" width="250" height="64" rx="8"/>
  <text class="name" x="432" y="284">to_velocity_y</text>
  <text class="kind" x="432" y="302">compute</text>
  <text class="detail" x="432" y="318">to_value, metre_per_second</text>
  <rect class="vehicle" x="420" y="348" width="250" height="64" rx="8"/>
  <text class="name" x="432" y="370">to_y</text>
  <text class="kind" x="432" y="388">compute</text>
  <text class="detail" x="432" y="404">to_value, metre</text>
  <rect class="gateway" x="820" y="391.0" width="250" height="64" rx="8"/>
  <text class="name" x="832" y="413.0">gateway</text>
  <text class="kind" x="832" y="431.0">gateway, Yamcs</text>
  <text class="detail" x="832" y="447.0">127.0.0.24:20600</text>
  <line class="link" x1="670" y1="122" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="122" x2="420" y2="122" marker-end="url(#arrow)"/>
  <line class="link" x1="420" y1="208" x2="290" y2="638" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
  <line class="link" x1="670" y1="208" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="294" x2="420" y2="208" marker-end="url(#arrow)"/>
  <line class="link" x1="670" y1="294" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="724" x2="420" y2="294" marker-end="url(#arrow)"/>
  <line class="link" x1="670" y1="380" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="810" x2="420" y2="380" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="380" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="208" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="290" y1="466" x2="820" y2="423" marker-end="url(#arrow)"/>
  <line class="link" x1="820" y1="423" x2="290" y2="552" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
</svg>
