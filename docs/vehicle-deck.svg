      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; }
      .kind { font-size: 11px; fill: #4b5563; }
      .sub { font-size: 13px; font-weight: bold; fill: #475569; }
      .label { font-size: 13px; fill: #1f2937; }
      .small { font-size: 12px; fill: #4b5563; }
      rect.sub { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; }
      rect.node { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      rect.gw { fill: #f3f4f6; stroke-width: 2; }
      .world { stroke: #0072B2; stroke-width: 2; fill: none; }
      .moc { stroke: #D55E00; stroke-width: 2.5; fill: none; stroke-dasharray: 9 6; }
      .bind { stroke: #CC79A7; stroke-width: 2.5; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
    </style>
