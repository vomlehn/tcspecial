<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">The iio example</title>
  <desc id="desc">A sensor of the kernel's iio_dummy, whose buffer a software trigger fills. tcspecial reads the buffer as sensor, device id 1, and each read's whole sample sets go by its payload-out link to ground, a gateway_radio node, and down to the MOC at 127.0.0.1:3741: ground_base, 3740, plus the id. Nothing goes up: a sensor's buffer is read and never written.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .socket { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .kernel { fill: #fdf6ec; stroke: #b45309; stroke-width: 1.6; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .up { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 8 4; }
      .down { fill: none; stroke: #2563eb; stroke-width: 2; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="20" y="44">KERNEL DUMMY DEVICE</text>
  <text class="heading" x="245" y="44">TCSPECIAL (VEHICLE)</text>
  <text class="heading" x="705" y="44">GROUND</text>

  <rect class="boundary" x="230" y="58" width="430" height="212" rx="14"/>

  <!-- The kernel's dummy sensor, which fills its own buffer -->

  <rect class="kernel" x="20" y="80" width="180" height="150" rx="10"/>
  <text class="name" x="36" y="107">iio_dummy</text>
  <text class="kind" x="36" y="128">the kernel's dummy</text>
  <text class="kind" x="36" y="148">IIO sensor</text>
  <text class="note" x="36" y="168"></text>
  <text class="detail" x="36" y="188">buffer, filled by</text>
  <text class="detail" x="36" y="208">an hrtimer trigger</text>

  <!-- The payload -->

  <rect class="socket" x="245" y="110" width="190" height="80" rx="10"/>
  <text class="name" x="261" y="137">sensor</text>
  <text class="kind" x="261" y="158">iio payload, id 1</text>
  <text class="detail" x="261" y="178">read only</text>

  <rect class="socket" x="470" y="110" width="170" height="150" rx="10"/>
  <text class="name" x="486" y="137">ground</text>
  <text class="kind" x="486" y="158">gateway_radio, id 0</text>
  <text class="detail" x="486" y="178">binds 127.0.0.1:3640</text>
  <text class="detail" x="486" y="198">ground_base</text>
  <text class="detail" x="486" y="218">  127.0.0.1:3740</text>

  <rect class="ground" x="705" y="110" width="180" height="150" rx="10"/>
  <text class="name" x="721" y="137">MOC</text>
  <text class="kind" x="721" y="158">ground station</text>
  <text class="detail" x="721" y="178">samples on :3741</text>

  <!-- Down: sample sets, to the ground -->
  <path class="down" d="M200,150 L241,150" marker-end="url(#arrow-blue)"/>
  <path class="down" d="M435,150 L466,170" marker-end="url(#arrow-blue)"/>
  <text class="label" x="400" y="100">payload-out</text>
  <path class="down" d="M640,180 L701,180" marker-end="url(#arrow-blue)"/>
  <text class="label" x="646" y="172">samples</text>

  <!-- Legend -->
  <line x1="45" y1="300" x2="860" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <path class="down" d="M45,332 L95,332" marker-end="url(#arrow-blue)"/>
  <text class="label" x="105" y="336">data, solid: device to ground</text>
  <rect class="kernel" x="45" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="75" y="369">made by the kernel</text>
  <rect class="socket" x="260" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="290" y="369">opened by tcspecial</text>
  <rect class="ground" x="470" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="500" y="369">the ground</text>
</svg>
