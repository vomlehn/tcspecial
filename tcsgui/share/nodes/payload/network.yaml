# Software reached over a socket: UDP, TCP, a Unix datagram, or raw IP.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/network/.
node: network
type: network
about: >
  Software reached over a socket: UDP, TCP, a Unix datagram, or raw IP.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: protocol
    required: true
    about: >
      Which transport carries it: udp, tcp, unix_dgram, or raw for IP
      datagrams of one protocol number on a raw socket.
  - name: address
    required: true
    about: >
      The host it is reached at, or bound at where the payload speaks first.
  - name: ip_protocol
    required: false
    about: >
      With protocol raw, and only then: the IP protocol number its datagrams
      carry, 1 to 254 (253 and 254 are set aside for experiments). A raw
      socket needs CAP_NET_RAW.
  - name: port
    required: false
    about: >
      The port that goes with the address. Every protocol but raw needs one,
      and raw takes none.
  - name: max_length
    required: false
    kind: whole
    about: >
      The most one packet may hold, in bytes: at most 4096. Required over tcp
      or unix_stream, which are streams of bytes and so say where a packet
      ends, as a serial line does; refused over the datagram protocols, whose
      datagrams are packets already.
  - name: read_timeout
    required: false
    kind: timeout
    about: >
      How long after its first byte a packet ends with what has arrived: 250
      ms, or none. Over tcp or unix_stream only. A stream says this,
      terminators or length_prefix.
  - name: terminators
    required: false
    about: >
      Byte sequences that each end a packet, and are its last bytes: the first
      to arrive whole ends it. Each written as a trigger is, and several with
      commas between them: "\r\n", [03]. Over tcp or unix_stream only, and not
      beside a length_prefix.
  - name: length_prefix
    required: false
    about: >
      What a packet's first bytes say its length is, counting the bytes after
      them: u8, or u16be or u16le. Over tcp or unix_stream only. Needs a
      read_timeout, which may be none.
  - name: group
    required: false
    about: >
      The payload group that reads it, where it is in one. Optional, though a
      payload that states a trigger needs one: the interval of its group is
      how often it is asked.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer: "READ\r", [55], or parts of both one
      after another, "AT" [0D 0A]. A payload with none is one the
      configuration describes as only read.
  - name: trigger_interval
    required: false
    kind: interval
    about: >
      How often the trigger goes out, which is how often this payload is
      asked: 500 ms, 3 s. Said by a payload that has a trigger and is in no
      group; a payload in one is asked when its group is read.
  - name: read_delay
    required: false
    kind: interval
    about: >
      How long to wait between asking and reading, which is what the part
      takes to answer: 2 ms, 200 us. With one, a pass asks, waits and reads
      the answer to the question it asked; with none, a pass reads what the
      last ask produced and asks again. Only beside a trigger.
  - name: poll_interval
    required: false
    kind: interval
    about: >
      The least time between one read of it and the next, for a payload
      nothing asks: 1 s, 500 ms. A floor rather than a rate -- nothing says
      how soon there will be anything to read -- said by a payload with no
      trigger that is in no group, and never beside a trigger.
  - name: init
    required: false
    kind: bytes
    about: >
      What to write to it as the vehicle opens it -- at startup, and whenever
      the ground starts it again -- written as a trigger is: a C string in quotes,
      bytes in brackets, or both one after another. A heater that must start off, a register
      to set before the part reads sensibly. A write that fails stops the
      node from starting.
