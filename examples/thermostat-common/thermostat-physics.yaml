# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-physics.schema.json

# The physics of the thermostat example's vehicle: the zone its sensors
# read, and the two heaters that warm it. Named by the simulator files of
# the thermostat example and of thermostat-yamcs, the same vehicle with
# Yamcs as its ground station, and by the manual's fixture,
# tests/manual/thermostat-sim.yaml, which is the same vehicle with its
# payloads on buses: one zone, stated once, here in thermostat-common, which
# the two examples share and which is not an example itself.
#
# Three parts, each simulated alone and joined below: a heater is switched
# on and gives out heat; the zone takes heat and has a temperature. The
# stand-ins in the simulator file are joined to their terminals by name --
# a sensor to zone.temperature, a heater's stand-in to heater_1.on -- and
# this file says nothing about them.
description: The physics of the vehicle of thermostat.ytcs and
  thermostat-yamcs.ytcs

physics:
  - type heater:
      # Two film heaters of four watts on a 28 volt bus, which on the zone
      # below is a fifth of a kelvin a second each. Small on purpose: the
      # two together hold the zone wherever the orbit is, and one alone holds
      # it only while its surroundings are warm, so that a heater disabled in
      # tcssim's window -- unpowered, or failed -- can be seen in the
      # temperature. The supply wanders by two percent over twenty seconds or
      # so, and a heater's power with its square.
      - component: heater_1
        power: "4 W"
        ripple: "0.02"
        ripple_time: "20 s"
        voltage: "28 V"

      - component: heater_2
        power: "4 W"
        ripple: "0.02"
        ripple_time: "20 s"
        voltage: "28 V"

  - type thermal_zone:
      # The zone: its surroundings ten kelvin below the setpoint of
      # thermostat.ytcs on average, losing the difference with a fifty second
      # constant -- which at the setpoint is a fifth of a kelvin a second of
      # cooling, four tenths of a watt a kelvin -- and twenty joules to warm a
      # kelvin, so that each heater's four watts is a fifth of a kelvin a
      # second.
      #
      # Its surroundings are not still. They swing six kelvin either side of
      # 283.15 once every ninety minutes -- a low orbit's sun and shadow -- and
      # wander half a kelvin besides, over ten minutes or so. Both heaters
      # settle the zone twenty kelvin above its surroundings, 297.15 K at the
      # coldest, which is above the thermostat's band, 291.15 to 295.15 K, so
      # the two together always bring it back and the thermostat cycles them.
      # One heater settles it ten kelvin above its surroundings, between
      # 287.15 and 299.15 K: enough in the warm part of the orbit, and for
      # about a quarter of it under 289.15 K, two half bands below the
      # setpoint. With neither, the zone follows its surroundings.
      - component: zone
        capacity: "20 J/K"
        environment: "283.15 K"
        period: "90 min"
        swing: "6 K"
        time_constant: "50 s"
        wander: "0.5 K"
        wander_time: "10 min"

connections:
  # Both heaters warm the zone, whose heat is the sum of what reaches it.
  - from: heater_1.heat
    to: zone.heat
  - from: heater_2.heat
    to: zone.heat
