# A sensor read through the kernel's IIO buffers.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/iio/.
node: iio
type: iio
about: A sensor read through the kernel's IIO buffers.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: path
    required: true
    kind: path
    about: >
      The IIO device it is reached through: /dev/iio:device0.
  - name: group
    required: false
    about: >
      The payload group that reads it, where it is in one. Optional, though a
      payload that states a trigger needs one: the interval of its group is
      how often it is asked.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer, as hex bytes. A payload with none
      is one the configuration describes as only read.
