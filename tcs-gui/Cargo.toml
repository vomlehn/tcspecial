[package]
name = "tcs-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "TCSpecial graphical configuration editor"
build = "build.rs"

[dependencies]
tcslib-protocol = { path = "../tcslib-protocol" }
# How a configuration is drawn: the panes, the node shapes, the routes and
# the colours, shared with tcspecial's visual window. See tcslib-diagram.
tcslib-diagram = { path = "../tcslib-diagram" }
# Asked about the files as the editor starts and after every edit, so that
# what it says about them is what tcs-verify, tcspecial, tcs-moc and tcs-sim
# say: see `errors_of`.
tcslib-verify = { path = "../tcslib-verify" }
# 1.18 rather than 1.3: the menu bar is a builtin element and the earlier
# versions have none. What the editor would otherwise need is a control of its
# own in place of a menu, which is a menu that behaves like nothing else on
# the platform.
slint = "1.18"
serde = { version = "1.0", features = ["derive"] }
# The undo history kept on disk, in YAML: the same crate tcslib-protocol reads
# the configuration files with. It was serde_yaml, which its author has
# deprecated; serde_norway is the maintained fork of it, writing the same YAML,
# so a history written before the change still reads.
serde_norway = "0.9.42"
libc = "0.2"
# The line diffs a save is merged from, so that a file is written back with
# only the lines an edit changed: see `faithful`.
similar = "3.2"
# Reads an XML file back after such a merge, to hold it to what the editor
# would have written. The version tcslib-protocol reads configurations with.
quick-xml = "0.42"
# The desktop's own Save dialog, for Save as: through the XDG desktop portal,
# over the D-Bus crate the window toolkit already brings in, rather than GTK.
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
] }
# Where a name with `..` in it leads, worked out from the name alone: an
# included file a directory up from a new top file is in a directory that
# need not be there yet, which the file system cannot resolve.
path-clean = "1.0.1"
# The digest of each file of the configuration the undo history is held to,
# so that a history is not replayed or undone onto a file something else has
# changed: see `history::OnDisk`. The version tcslib-protocol digests with.
md5 = "0.8"

[dev-dependencies]
# Lays the window out headlessly, so a test can measure it rather than a
# person looking at it. The same backend tcs-moc and tcs-sim are tested through.
i-slint-backend-testing = "1.18"
# Directories a test can fill and have cleaned up after it, which is what the
# saving tests need: they write real files and then go looking at them.
tempfile = "3.27.0"
# Writes the screenshots in the manual: see `shots`. The version the window
# toolkit already brings in.
png = "0.18"
# For the schema tests, which read the schemas' JSON and hold it against the
# software's own lists. Only the tests: the editor reads no JSON.
serde_json = "1.0"
# Holds the shipped simulator files to the simulator schema whole, as an
# editor's language server would, where the tests above check it word by
# word. Without its network and file resolvers: the schema refers only to
# itself.
jsonschema = { version = "0.60", default-features = false }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
