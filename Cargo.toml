[workspace]
resolver = "2"

members = [
    "tcslibgs",
    "tcslib",
    "tcspecial",
    "tcsmoc",
    "tcssim",
    "tcsverify",
    "tcsgui",
    # The window pieces the ground programs share: the panels, and what to
    # show on them. See tcsui.
    "tcsui",
    # How a configuration is drawn -- the panes, the nodes, the links -- for
    # the editor and for tcspecial's visual window alike. See tcsdiagram.
    "tcsdiagram",
    # tcslib for C and C++: the ground station's library behind one header.
    # See tcslib-c.
    "tcslib-c",
    # The file interfaces an app node's program is run with, and the five
    # apps that are run over them: see tcsapp. Three are nodes of the
    # vehicle's own and two are payloads.
    "tcsapp",
    "app_payload_veh",
    "app_moc_veh",
    "app_all_veh",
    "app_pl",
    "app_all_pl",
    # The programs of an example: see examples/README.md.
    "examples/simple-app",
    "examples/beacon",
    # Its ground station is Python: this crate is the tests that hold the
    # Python to the Rust it is written after.
    "examples/ping",
]

# Each argument's description in a doc comment, continuation lines and all,
# starts in one column, as the TCS projects' documentation rule has it.
# That is deeper than the two spaces this lint asks of a list item's
# continuation, so it is allowed. Every member takes these lints.
[workspace.lints.clippy]
doc_overindented_list_items = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TCSpecial Team"]
license = "MIT OR Apache-2.0"
#log = "0.4"
#env_logger = "0.10"
