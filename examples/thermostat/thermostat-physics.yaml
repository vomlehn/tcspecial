# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-physics.schema.json

# The physics of the thermostat example's vehicle: the cabin its sensors
# read and its heaters warm. Named by thermostat-sim.yaml, and by the
# manual's fixture, tests/manual/thermostat-sim.yaml, which is the same
# vehicle with its payloads on buses: one cabin, stated once.
description: The physics of the vehicle of thermostat.ytcs

physics:
  # The cabin: ten kelvin below the setpoint of thermostat.ytcs, losing the
  # difference with a fifty second constant -- which at the setpoint is a
  # fifth of a kelvin a second of cooling. A heater is connected to an input
  # and a sensor to an output, and any of them may be left unconnected.
  #
  # Its surroundings are not still. They swing three kelvin either side of
  # 283.15 once every ninety minutes -- a low orbit's sun and shadow -- and
  # wander half a kelvin besides, over ten minutes or so. The cabin is not
  # one temperature throughout either: the place out2's sensor is on is a
  # fifth of a kelvin warmer than the middle, and out3's three tenths
  # cooler.
  - name: basic
    type: thermal_mass
    environment: "283.15"
    time_constant: "50 s"
    inputs: "in1,in2"
    outputs: "out1,out2=+0.2,out3=-0.3"
    swing: "3"
    period: "90 min"
    wander: "0.5"
    wander_time: "10 min"
