[package]
name = "tcs-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
Window pieces shared by the TCSpecial ground programs: the panels, and what to \
show on them"""

[dependencies]
# What the system is asked: see tcsos.
tcsos = { path = "../tcsos" }
# What a panel reports is `tcsmoc::beacon`'s: this crate is how it is shown,
# not what it means.
tcsmoc = { path = "../tcsmoc" }
# For Color alone, which is what a stage of staleness is turned into here.
slint = "1.3"

# In a web page, the canvas a window is drawn on, which tcsos shows and hides
# as the window is: see src/windows.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "1.3", features = ["unstable-winit-030"] }

[lints]
workspace = true
