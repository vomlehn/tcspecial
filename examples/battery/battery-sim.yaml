# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim simulates the payloads of battery.ytcs.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated.
#
# Each simulated payload is joined to the physics model: the power monitor
# reports
# the battery's voltage, which on a bus with no regulator is the bus's; the
# shunt reports the current into the battery; and the science switch sheds
# the science load. So the loop closes through tcspecial: the shunt's
# current is counted into a charge, the charge decides the shedding, and
# the shedding changes the current.
description: Simulator settings for the payloads of battery.ytcs

# Where tcssim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7910"

# The physics of the battery example's vehicle: its power system, as the
# parts it is made of. The sun lights the solar array; the array supplies
# the bus, the loads draw on it, and what is left over charges the battery,
# or, in shadow, what the array cannot give the battery makes up. The
# simulated payloads below are joined to its terminals by name, with
# connects.
#
# The orbit is six minutes where a low one is ninety, and the battery a
# tenth of what a vehicle of these loads would fly, so that a run on a
# desk sees a whole orbit -- the charge, the battery full and its current
# shunted, the eclipse, the science load shed and restored -- in the time
# it takes to watch it.
world:
  physics:
    components:
      - type battery:
          # Eight lithium-ion cells in series, 24 V empty and 33.2 V full, of a
          # fifth of an ampere-hour, starting six tenths full. With both loads
          # on in shadow it would lose four fifths of its charge in an eclipse;
          # shed at three tenths, it comes through.
          - component: battery
            capacity: "0.2 Ah"
            charge: "0.6"
            empty: "24 V"
            full: "33.2 V"
            resistance: "0.05 ohm"

      - type bus:
          - component: bus

      - type load:
          # The avionics, which are never shed, and the science instrument,
          # which is: two amperes each.
          - component: avionics
            current: "2 A"

          - component: science
            current: "2 A"

      - type solar_array:
          # Seven amperes in full sunlight.
          - component: array
            current: "7 A"

      - type sun:
          # Four tenths of the orbit in the planet's shadow: two minutes and
          # twenty-four seconds dark, three minutes and thirty-six lit.
          - component: sun
            eclipse: "0.4"
            period: "6 min"

    connections:
      - from: sun.light
        to: array.light
      - from: array.current
        to: bus.supply
      - from: avionics.current
        to: bus.demand
      - from: science.current
        to: bus.demand
      - from: bus.current
        to: battery.offered

simulated_payloads:
  - type network:
      # Driven and never read: tcssim sends nothing, counts each decision the
      # vehicle sends it, and sheds the science load while it is told to.
      - payload: science
        connects: science.shed
        protocol: udp
        simulate: true

      # Twice a second, with ten milliamperes of noise: the charge program
      # counts it, noise and all, which is what a real count does.
      - payload: shunt
        connects: battery.current
        noise: "0.01 A"
        packet_interval: 500 ms
        protocol: udp
        simulate: true

  - type serial:
      # Asked, and answering: a triggered payload has no rate of its own here.
      # Accurate to twenty millivolts, with five of noise on each reading.
      - payload: monitor
        accuracy: "0.02 V"
        connects: battery.voltage
        noise: "0.005 V"
        simulate: true
