# The command interpreter's own configuration.
#
# Read by tcspecial at startup, from the path TCSPECIAL_CONFIG_PATH names when
# it is set. Nothing about the payloads is here: which data handlers exist and
# how to reach them is a payload configuration, named on tcspecial's command
# line.
#
# This is parsed as YAML because it is named .yaml. Every configuration file in
# the project chooses its parser from its extension -- .yaml, .yml or .xml --
# so the same settings in an .xml file would be read just as well. That is as
# true of this file as of a payload configuration or a simulator
# configuration: the formats are two spellings of one set of values.
#
# Most of what is here is a subsection, because most of it is one thing with
# more than one attribute to it: a prefix repeated on two or three flat names
# is a subsection somebody declined to write. The names under one are short for
# the same reason -- beacon.send says what beacon_send said, where the reader
# is already looking at the beacon.
#
# The spacecraft command link, which is one conversation and two sockets.
# tcs_cmd.recv is tcspecial's own: it receives commands about the spacecraft
# there -- ping it, arm it, restart it -- and sends its responses from there,
# a response going back out of the socket its command arrived on. tcs_cmd.send
# is the MOC's own, which it sends those commands from and receives the
# responses on.
#
# Both ends are in this file because both ends read this file: a configuration
# that stated only its own end would leave the other to be told separately, and
# two places to say one thing is one place for them to disagree. One table says
# which commands belong to which link, read by both ends, so neither can send a
# command to the link the other does not expect it on.
#
# A command about a payload -- start it, stop it, ask it for its statistics --
# is taken on that payload's own socket instead, under payload_command below.
# Separate links rather than one because what the ground needs in a hurry must
# never be queued behind what it asked for at leisure: a restart waiting behind
# a payload's statistics is a spacecraft that cannot be rescued while it is
# busy. On a space link these become virtual channels, which is where the
# priority between them is really decided; here they are ports, which is what
# an IP network has to divide traffic with.
#
# Every address here is written with its port, as address:port: two things only
# ever used together are one fact about a configuration, and writing them apart
# invites a file that states one and not the other. The protocol is not stated
# and cannot be -- the link between tcspecial and the ground is UDP, so a
# configuration that could say otherwise would be one that could say something
# untrue.
#
# Note the quotes: unquoted, 0.0.0.0:4000 is a string in YAML only because it
# happens not to be a number, which is a thin reason to rely on.
tcs_cmd:
  recv: "0.0.0.0:4000"
  send: "127.0.0.1:4100"

# Where each payload is commanded: both ends of its own link. A payload's port
# on each side is that side's base plus the payload's own id -- the position it
# has in the payload configuration -- so these two lines say where all of them
# are. source_base is the ground's end, which the MOC binds to send a payload's
# commands and receive its answers; dest_base is the vehicle's, which tcspecial
# binds.
#
# One socket per payload rather than one for all of them, which is what this
# was: a command about a slow payload is then not ahead of a command about a
# quick one, and the end a command comes from is a socket this file names --
# which is what lets tcspecial refuse a payload command from anywhere else.
payload_command:
  source_base: "127.0.0.1:4300"
  dest_base: "0.0.0.0:4200"

# Where each payload's telemetry comes from and goes to. A payload's port on
# each side is that side's base plus the payload's own id -- the position it has
# in the payload configuration -- so these two lines say where all of them are,
# on the vehicle's side and on the MOC's. One base and an arithmetic rule rather
# than an address and a port written on every payload: forty payloads were
# forty chances to repeat a port, and a repeated port is two payloads whose data
# arrives interleaved.
payload_telemetry:
  source_base: "0.0.0.0:6000"
  dest_base: "127.0.0.1:6100"

# How often beacons go out, and the two ends they go between. All three are
# required of every command interpreter configuration, here and in the
# tcspecial section of a tcspecial configuration file: beacons are how the
# ground knows the spacecraft is alive, so none of them is a question to leave
# to a default that a file silently takes.
#
# A payload set's section states them for that set and wins over these. These
# are what place a set whose tcspecial configuration states no such section.
#
# beacon.send is where beacons come from: tcspecial makes the socket it sends
# them on out of it, binding that address and port. beacon.recv is where they
# are received: tcsmoc makes the socket it receives them on out of it, and it is
# where tcspecial sends. Both read both from this file, which is how the two
# ends come to name one pair; a sender and a listener that disagreed would lose
# every beacon with nothing to say so.
#
# It was a multicast group and the name of a local interface to join it on,
# which bought any number of ground stations listening without being named and
# cost an attribute whose being wrong lost every beacon in silence. One sender
# and one receiver, both written down, can be described to a firewall or a
# capture filter by somebody reading this file.
beacon:
  interval: "5s"
  send: "0.0.0.0:5550"
  recv: "127.0.0.1:5650"

# Where the telemetry log is written, and in what sized pieces. Both have
# defaults, and so does the subsection: a configuration that says nothing about
# logging runs without one, which is a configuration somebody may mean -- a
# vehicle with no writable storage.
log:
  directory: /tmp/telemetry
  segment_size: 65536
