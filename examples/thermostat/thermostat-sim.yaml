# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of thermostat.yaml.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated: the heaters
# are driven and never read, so there is nothing to send in their place, and
# they are left out.
description: Simulator settings for the payloads of thermostat.yaml

simulated_payload_groups:
  # The three sensors are read together, every three seconds, as their
  # payload group in thermostat.yaml says.
  - name: cabin_temps
    packet_interval: 3s

simulated_payloads:
  - name: temp_fore
    type: i2c
    group: cabin_temps

  - name: temp_aft
    type: i2c
    group: cabin_temps

  - name: temp_bay
    type: spi
    group: cabin_temps
