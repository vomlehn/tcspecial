<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000" role="img" aria-labelledby="title desc">
  <title id="title">The thermostat-yamcs example</title>
  <desc id="desc">The thermostat example&#8217;s vehicle, with Yamcs as its ground station. Three temperature sensors of one place on the thermal mass, temp_1, temp_2 and temp_3, read together ten times a second as the group zone_temps, are the far end of UDP sockets on this host, ports 17801 to 17803, which tcssim stands in for. Each reading is converted to kelvin by temp1, temp2 and temp3, and each goes to the gateway node, to ambient as input in0, in1 or in2, and to the log housekeeping. ambient votes over the three, by the median, and its value goes to the gateway node and to thermostat, a thermostat holding 293.15 K within a half-band of 2.0, whose decision is logged and drives the two heaters, each through a GPIO line of its own, gpio-out-tmass1 on line 4 and gpio-out-tmass2 on line 5. The thermostat&#8217;s decision does not go to the ground: what does is gpio-in-tmass, lines 2 and 3 on the thermal mass, each sensing one heater, read every second, so the ground sees what the heaters are doing rather than what they were told. The lines are on the kernel&#8217;s simulated chip, /dev/gpiochip1. The gateway node is a gateway_yamcs node: tcspecial puts a CCSDS primary header on what each of ambient, gpio-in-tmass, temp1, temp2 and temp3 produces and sends it to Yamcs at the gateway node&#8217;s ground_base, 127.0.0.1:17700, plus the source&#8217;s device id, as telemetry of APID apid_base, 0x400, plus that device id: 17700 and 0x400 for ambient, 17702 and 0x402 for gpio-in-tmass, 17706 to 17708 and 0x406 to 0x408 for the conversions. Yamcs&#8217;s mission database, generated from the configuration, reads each conversion&#8217;s and the vote&#8217;s data as a temperature in kelvin and each line&#8217;s level as on or off, and thermostat_yamcs.py reads them back over Yamcs&#8217;s REST API and shows them. The ground sets the thermostat&#8217;s setpoint through a command binding on the gateway node, which tcspecial binds at 127.0.0.1:17600.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .port { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #6b21a8; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .payload { fill: #eaf2fb; stroke: #2f6db5; stroke-width: 1.6; }
      .vehicle { fill: #f5f0fc; stroke: #7e57c2; stroke-width: 1.6; }
      .gateway { fill: #e9f6ee; stroke: #2e7d4f; stroke-width: 1.6; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .groundside { fill: #f8faf8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .call { fill: none; stroke: #374151; stroke-width: 2.4; }
      .code { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
      .portno { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #1e40af; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .groundward { fill: none; stroke: #2563eb; stroke-width: 1.8; }
      .vehicleward { fill: none; stroke: #d97706; stroke-width: 2; }
      .command { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1300" height="1000" fill="#ffffff"/>
  <!-- Column headings -->
  <text class="heading" x="60" y="40">PAYLOADS</text>
  <!-- tcspecial, the vehicle -->
  <rect class="boundary" x="270" y="52" width="710" height="828" rx="16"/>
  <text class="heading" x="290" y="78">TCSPECIAL (VEHICLE)</text>
  <!-- The group the three sensors are read in -->
  <rect class="group" x="50" y="88" width="192" height="344" rx="12"/>
  <text class="note" x="58" y="448">group zone_temps,</text>
  <text class="note" x="58" y="464">read every 100 ms</text>
  <!-- Payloads -->
  <rect class="payload" x="60" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="124">temp_1</text>
  <text class="kind" x="74" y="144">network, udp</text>
  <text class="detail" x="74" y="162">127.0.0.1:17801</text>
  <rect class="payload" x="60" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="244">temp_2</text>
  <text class="kind" x="74" y="264">network, udp</text>
  <text class="detail" x="74" y="282">127.0.0.1:17802</text>
  <rect class="payload" x="60" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="364">temp_3</text>
  <text class="kind" x="74" y="384">network, udp</text>
  <text class="detail" x="74" y="402">127.0.0.1:17803</text>
  <rect class="payload" x="60" y="580" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="604">gpio-out-tmass1</text>
  <text class="kind" x="74" y="624">gpio, output</text>
  <text class="detail" x="74" y="642">line 4: heater_1</text>
  <rect class="payload" x="60" y="680" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="704">gpio-out-tmass2</text>
  <text class="kind" x="74" y="724">gpio, output</text>
  <text class="detail" x="74" y="742">line 5: heater_2</text>
  <rect class="payload" x="60" y="780" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="804">gpio-in-tmass</text>
  <text class="kind" x="74" y="824">gpio, read every 1 s</text>
  <text class="detail" x="74" y="842">lines 2, 3: heaters</text>
  <text class="note" x="58" y="874">on /dev/gpiochip1, the</text>
  <text class="note" x="58" y="890">kernel&#8217;s simulated chip</text>
  <!-- Conversions -->
  <rect class="vehicle" x="300" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="124">temp1</text>
  <text class="kind" x="314" y="144">compute, to_kelvin</text>
  <text class="detail" x="314" y="162">i16_be</text>
  <rect class="vehicle" x="300" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="244">temp2</text>
  <text class="kind" x="314" y="264">compute, to_kelvin</text>
  <text class="detail" x="314" y="282">i16_be</text>
  <rect class="vehicle" x="300" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="364">temp3</text>
  <text class="kind" x="314" y="384">compute, to_kelvin</text>
  <text class="detail" x="314" y="402">u24_be</text>
  <!-- The vote over the three, with its named inputs -->
  <rect class="vehicle" x="540" y="220" width="170" height="80" rx="10"/>
  <text class="name" x="574" y="244">ambient</text>
  <text class="kind" x="574" y="264">compute, vote: median</text>
  <text class="port" x="546" y="236">in0</text>
  <text class="port" x="546" y="261">in1</text>
  <text class="port" x="546" y="286">in2</text>
  <!-- The log -->
  <rect class="vehicle" x="540" y="470" width="170" height="74" rx="10"/>
  <text class="name" x="554" y="494">housekeeping</text>
  <text class="kind" x="554" y="514">log</text>
  <text class="detail" x="554" y="532">/tmp/telemetry</text>
  <!-- The thermostat -->
  <rect class="vehicle" x="780" y="340" width="188" height="74" rx="10"/>
  <text class="name" x="794" y="364">thermostat</text>
  <text class="kind" x="794" y="384">compute, thermostat</text>
  <text class="detail" x="794" y="402">293.15 K, half_band 2.0</text>
  <!-- The ground -->
  <rect class="groundside" x="1010" y="52" width="270" height="828" rx="16"/>
  <text class="heading" x="1028" y="78">GROUND</text>
  <!-- The gateway node, on the ground -->
  <rect class="gateway" x="1030" y="96" width="230" height="96" rx="10"/>
  <text class="name" x="1044" y="120">gateway</text>
  <text class="kind" x="1044" y="140">gateway_yamcs, CCSDS packets</text>
  <text class="detail" x="1044" y="158">ground_base 127.0.0.1:17700</text>
  <text class="detail" x="1044" y="176">apid_base 0x400, port 17600</text>
  <!-- Yamcs, and the program that reads it -->
  <rect class="ground" x="1030" y="430" width="230" height="80" rx="10"/>
  <text class="name" x="1044" y="456">Yamcs</text>
  <text class="kind" x="1044" y="477">a temperature, in K, or on/off</text>
  <text class="detail" x="1044" y="496">thermostat_yamcs.py shows them</text>
  <!-- Sensors to their conversions -->
  <path class="groundward" d="M230,137 L296,137" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,257 L296,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,377 L296,377" marker-end="url(#arrow-blue)"/>
  <!-- Each conversion to the ground link -->
  <path class="groundward" d="M470,116 L1026,116" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,238 C505,238 505,131 540,131 L1026,131" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,358 C512,358 512,146 548,146 L1026,146" marker-end="url(#arrow-blue)"/>
  <!-- Each conversion into the mean, by name -->
  <path class="groundward" d="M470,137 C505,137 505,232 536,232" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,257 L536,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,377 C505,377 505,282 536,282" marker-end="url(#arrow-blue)"/>
  <!-- Each conversion into the log -->
  <path class="groundward" d="M470,158 C498,158 498,484 536,484" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,278 C494,278 494,500 536,500" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,398 C490,398 490,516 536,516" marker-end="url(#arrow-blue)"/>
  <!-- The mean to the ground link and to the thermostat -->
  <path class="groundward" d="M710,240 C745,240 745,161 780,161 L1026,161" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M710,280 C745,280 745,377 776,377" marker-end="url(#arrow-blue)"/>
  <!-- The thermostat's decision, logged -->
  <path class="groundward" d="M780,400 C745,400 745,527 714,527" marker-end="url(#arrow-blue)"/>
  <!-- The thermostat drives both heaters, each through a line of its own:
       one decision, two circuits -->
  <path class="vehicleward" d="M865,414 L865,717 L234,717" marker-end="url(#arrow-orange)"/>
  <path class="vehicleward" d="M865,617 L234,617" marker-end="url(#arrow-orange)"/>
  <text class="label" x="600" y="609">gateway-out: on below the band</text>
  <text class="label" x="600" y="709">and to the second heater</text>
  <!-- The lines sensing the heaters, to the ground and to the log -->
  <path class="groundward" d="M230,812 L1020,812 L1020,215 L1050,215 L1050,196" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,830 L500,830 C520,830 520,538 536,538" marker-end="url(#arrow-blue)"/>
  <text class="label" x="600" y="804">what the heaters are doing</text>
  <!-- Each source's port on the ground: ground_base plus its device id -->
  <text class="portno" x="972" y="113">17706</text>
  <text class="portno" x="972" y="128">17707</text>
  <text class="portno" x="972" y="143">17708</text>
  <text class="portno" x="972" y="158">17700</text>
  <text class="portno" x="1056" y="212">17702</text>
  <!-- The ground sets the setpoint -->
  <path class="command" d="M1030,180 L900,180 L900,336" marker-end="url(#arrow-orange)"/>
  <text class="label" x="910" y="252">command:</text>
  <text class="label" x="910" y="268">sets setpoint</text>
  <!-- Yamcs reads each packet by its APID -->
  <path class="call" d="M1145,192 L1145,426" marker-end="url(#arrow-call)"/>
  <text class="code" x="1155" y="304">one parameter</text>
  <text class="code" x="1155" y="320">per APID</text>
  <!-- Legend -->
  <line x1="50" y1="900" x2="1260" y2="900" stroke="#e5e7eb" stroke-width="1"/>
  <path class="groundward" d="M50,932 L100,932" marker-end="url(#arrow-blue)"/>
  <text class="label" x="110" y="936">data link, toward the ground</text>
  <path class="vehicleward" d="M330,932 L380,932" marker-end="url(#arrow-orange)"/>
  <text class="label" x="390" y="936">data link, toward the vehicle</text>
  <path class="command" d="M610,932 L660,932" marker-end="url(#arrow-orange)"/>
  <text class="label" x="670" y="936">command binding</text>
  <path class="call" d="M830,932 L880,932" marker-end="url(#arrow-call)"/>
  <text class="label" x="890" y="936">CCSDS packets, read by Yamcs</text>
  <rect class="payload" x="50" y="962" width="22" height="16" rx="4"/>
  <text class="label" x="80" y="975">payload</text>
  <rect class="vehicle" x="170" y="962" width="22" height="16" rx="4"/>
  <text class="label" x="200" y="975">vehicle node</text>
  <rect class="gateway" x="320" y="962" width="22" height="16" rx="4"/>
  <text class="label" x="350" y="975">gateway node</text>
  <rect class="ground" x="450" y="962" width="22" height="16" rx="4"/>
  <text class="label" x="480" y="975">ground station</text>
  <rect class="group" x="620" y="962" width="22" height="16" rx="4"/>
  <text class="label" x="650" y="975">payload group</text>
</svg>
