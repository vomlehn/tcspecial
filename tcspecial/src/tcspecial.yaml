# The command interpreter's own configuration.
#
# Read by tcspecial at startup, from the path TCSPECIAL_CONFIG_PATH names when
# it is set. Nothing about the payloads is here: which data handlers exist and
# how to reach them is a payload configuration, named on tcspecial's command
# line.
#
# This is parsed as YAML because it is named .yaml. Every configuration file in
# the project chooses its parser from its extension -- .yaml, .yml or .xml --
# so the same settings in an .xml file would be read just as well. That is as
# true of this file as of a payload configuration or a simulator
# configuration: the formats are two spellings of one set of values.
#
# The two command links. A command about the spacecraft -- ping it, arm it,
# restart it -- is taken on tcs_cmd_recv; a command about a payload --
# start it, stop it, ask it for its statistics -- on payload_interface. moc_cmd_send is the other end of the same conversation, which is in
# this file because both ends read this file: a configuration that stated only
# its own end would leave the other to be told separately, and two places to
# say one thing is one place for them to disagree. One table says which is which, read by both ends, so neither can
# send a command to the link the other does not expect it on.
#
# Two links rather than one because what the ground needs in a hurry must
# never be queued behind what it asked for at leisure: a restart waiting
# behind a payload's statistics is a spacecraft that cannot be rescued while
# it is busy. On a space link the two become two virtual channels, which is
# where the priority between them is really decided; here they are two ports,
# which is what an IP network has to divide traffic with.
#
# The address and its port are one value, as the beacon address below is: two
# things only ever used together are one fact about a configuration, and
# writing them apart invites a file that states one and not the other. The
# protocol is not stated and cannot be -- the link between tcspecial and the
# ground is UDP, so a configuration that could say otherwise would be one that
# could say something untrue.
#
# Note the quotes: unquoted, 0.0.0.0:4000 is a string in YAML only because it
# happens not to be a number, which is a thin reason to rely on.
tcs_cmd_recv: "0.0.0.0:4000"
moc_cmd_send: "127.0.0.1:4100"
payload_interface: "0.0.0.0:4001"

# Where each payload's own data link is, on each side. A payload's port is the
# base plus the payload's own id -- the position it has in the payload
# configuration -- so these two lines say where all of them are, on tcspecial's
# side and on the MOC's. One base and an arithmetic rule rather than an address
# and a port written on every payload: forty payloads were forty chances to
# repeat a port, and a repeated port is two payloads whose data arrives
# interleaved.
tcs_tc_base: "0.0.0.0:6000"
moc_tc_base: "127.0.0.1:6100"

# How often beacons go out and where they go. Both are required of every
# command interpreter configuration, here and in the tcspecial section of a
# tcspecial configuration file: beacons are how the ground knows the spacecraft
# is alive, so neither is a question to leave to a default that a file
# silently takes.
#
# A payload set's section states them for that set and wins over these. These
# are what place a set whose tcspecial configuration states no such section.
#
# The address is a multicast group, which is what a beacon wants: any number of
# ground stations join it, and neither end needs the other's address. The
# interface is the local one both ends use -- 127.0.0.1 because tcsmoc and
# tcspecial are run on one machine here. Both read it from this file, which is
# how they come to name the same one; a sender and a listener on different
# interfaces lose every beacon with nothing to say so.
beacon_interval_ms: 5000
beacon_send: "239.255.0.1:5550"
beacon_interface: "127.0.0.1"
log_dir: telemetry
log_segment_bytes: 65536
