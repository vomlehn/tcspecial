# yaml-language-server: $schema=tcsgui/share/schema/tcspecial.schema.json

version: "2.0"
description: "One payload on a UDP link, its telemetry going to the ground"

tcspecial:
  beacon:
    interval: "1 s"

payload_groups:
  - name: "every_second"
    interval: "1 s"

moc:
  - name: moc-1
    type: moc

tcsgui:
  nodes:
    - { name: moc-1, x: 469, y: 34 }
