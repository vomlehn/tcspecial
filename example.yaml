# yaml-language-server: $schema=tcsgui/share/schema/tcspecial.schema.json

description: "The ground link alone, ready for payloads to be added"

tcspecial:
  beacon:
    interval: "1 s"
    recv: "127.0.0.1:5650"
    send: "0.0.0.0:5550"
  gateway: "radio"
  payload_command:
    dest_base: "0.0.0.0:4200"
    source_base: "127.0.0.1:4300"
  payload_telemetry:
    dest_base: "127.0.0.1:6100"
    source_base: "0.0.0.0:6000"
  tcs_cmd:
    recv: "0.0.0.0:4000"
    send: "127.0.0.1:4100"

moc:
  - name: moc-1
    type: moc
    address: "127.0.0.1"
    ground_base: "127.0.0.1:5100"
    port: "5000"
    payload-in: true

payloads:
  - name: spi-1
    type: spi
    max_speed: "1000000"
    path: "/dev/spidev0.0"
    spi_mode: "0"
    stand_in: "127.0.0.1:7951"
    payload-out:
      - target: moc-1

tcsgui:
  nodes:
    - { name: moc-1, x: 469, y: 34 }
    - { name: spi-1, x: 15, y: 34 }
