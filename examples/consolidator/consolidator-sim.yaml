# yaml-language-server: $schema=../../tcsprotocol/schema/tcspecial-sim.schema.json

description: Simulator settings for the sensors of consolidator.ytcs, each
  reporting at its own pace

# The run's simulation mode, which tcspecial, tcs-sim and tcs-moc all read
# here: all, every payload a simulated or dummy device, as on a desk with no
# hardware. See "Simulation Modes" in docs/tcspecial-design.rst.
tcspecial:
  simulate: all

tcs-sim:
  ready: "127.0.0.14:7932"

# Each sensor sends from the start, enabled as though Enable had been
# pressed in tcs-sim's window: the example is about what the consolidator
# sends, and a sensor held back would show only its default.
simulated_payloads:
  - type network:
      - payload: sun
        packet_interval: 1 s
        protocol: udp
        simulate: true
        enable: true
      - payload: wheel
        packet_interval: 250 ms
        protocol: udp
        simulate: true
        enable: true
      - payload: battery
        packet_interval: 5 s
        protocol: udp
        simulate: true
        enable: true
