# Discrete lines, driven or watched as events.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/gpio/.
node: gpio
type: gpio
about: Discrete lines, driven or watched as events.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: path
    required: true
    kind: path
    about: >
      The GPIO chip the lines are on: /dev/gpiochip0.
  - name: lines
    required: true
    about: Which lines of that chip it drives or watches, comma separated.
  - name: direction
    required: false
    about: >
      Whether the lines are driven or read: output or input.
  - name: edge
    required: false
    about: >
      Which edge of an input line is an event: rising, falling or both.
  - name: bias
    required: false
    about: >
      Which way an input line is biased when nothing drives it: pull_up,
      pull_down or none.
  - name: debounce
    required: false
    kind: interval
    about: >
      How long a line must hold its level to count as an event, as a length of
      time: 50 us, 2 ms.
  - name: group
    required: false
    about: >
      The payload group it belongs to, where it is in one.
  - name: state_interval
    required: false
    kind: interval
    about: >
      How often to report what the lines are: 5 s. Edges say when a line
      changed and this says what it is now, so a set of lines may ask for
      either or both -- and a line that has not changed since the vehicle
      started tells the ground nothing until this is stated. Inputs only.
