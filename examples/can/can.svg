<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">The can example</title>
  <desc id="desc">A motor controller on the kernel's virtual CAN bus, vcan0, reached as two payloads, one for each identifier its frames carry. Each frame carrying 0x123 is read by motor_status, device id 2, and goes by its payload-out link to ground, a gateway_radio node, and down to the MOC at 127.0.0.1:3702: ground_base, 3700, plus the id. A command the MOC sends up to 127.0.0.1:3600, which ground binds, leaves it by its gateway-out link for motor_command, device id 1, which puts it on the bus as one frame carrying 0x124.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .socket { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .kernel { fill: #fdf6ec; stroke: #b45309; stroke-width: 1.6; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .up { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 8 4; }
      .down { fill: none; stroke: #2563eb; stroke-width: 2; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="20" y="44">KERNEL DUMMY DEVICE</text>
  <text class="heading" x="245" y="44">TCSPECIAL (VEHICLE)</text>
  <text class="heading" x="705" y="44">GROUND</text>

  <rect class="boundary" x="230" y="58" width="430" height="232" rx="14"/>

  <!-- The kernel's virtual bus, which the test is a member of -->

  <rect class="kernel" x="20" y="80" width="180" height="210" rx="10"/>
  <text class="name" x="36" y="107">vcan0</text>
  <text class="kind" x="36" y="128">the kernel's virtual</text>
  <text class="kind" x="36" y="148">CAN bus</text>
  <text class="note" x="36" y="168"></text>
  <text class="detail" x="36" y="188">frames 0x123 in</text>
  <text class="detail" x="36" y="208">frames 0x124 out</text>

  <!-- The two payloads, one identifier each -->

  <rect class="socket" x="245" y="80" width="190" height="80" rx="10"/>
  <text class="name" x="261" y="107">motor_status</text>
  <text class="kind" x="261" y="128">can payload, id 2</text>
  <text class="detail" x="261" y="148">can_id 0x123</text>

  <rect class="socket" x="245" y="210" width="190" height="80" rx="10"/>
  <text class="name" x="261" y="237">motor_command</text>
  <text class="kind" x="261" y="258">can payload, id 1</text>
  <text class="detail" x="261" y="278">can_id 0x124</text>

  <rect class="socket" x="470" y="110" width="170" height="150" rx="10"/>
  <text class="name" x="486" y="137">ground</text>
  <text class="kind" x="486" y="158">gateway_radio, id 0</text>
  <text class="detail" x="486" y="178">binds 127.0.0.1:3600</text>
  <text class="detail" x="486" y="198">ground_base</text>
  <text class="detail" x="486" y="218">  127.0.0.1:3700</text>

  <rect class="ground" x="705" y="110" width="180" height="150" rx="10"/>
  <text class="name" x="721" y="137">MOC</text>
  <text class="kind" x="721" y="158">ground station</text>
  <text class="detail" x="721" y="178">status on :3702</text>
  <text class="note" x="721" y="198"></text>
  <text class="note" x="721" y="218">commands up</text>
  <text class="detail" x="721" y="238">  to :3600</text>

  <!-- Down: a status frame, to the ground -->
  <path class="down" d="M200,120 L241,120" marker-end="url(#arrow-blue)"/>
  <path class="down" d="M435,120 L466,140" marker-end="url(#arrow-blue)"/>
  <text class="label" x="400" y="100">payload-out</text>
  <path class="down" d="M640,150 L701,150" marker-end="url(#arrow-blue)"/>
  <text class="label" x="646" y="142">status</text>

  <!-- Up: a command, from the ground to the bus -->
  <path class="up" d="M701,230 L644,230" marker-end="url(#arrow-amber)"/>
  <text class="label" x="646" y="222">command</text>
  <path class="up" d="M470,240 L439,250" marker-end="url(#arrow-amber)"/>
  <text class="label" x="440" y="275">gateway-out</text>
  <path class="up" d="M245,250 L204,250" marker-end="url(#arrow-amber)"/>

  <!-- Legend -->
  <line x1="45" y1="320" x2="860" y2="320" stroke="#e5e7eb" stroke-width="1"/>
  <path class="down" d="M45,352 L95,352" marker-end="url(#arrow-blue)"/>
  <text class="label" x="105" y="356">data, solid: device to ground</text>
  <path class="up" d="M400,352 L450,352" marker-end="url(#arrow-amber)"/>
  <text class="label" x="460" y="356">command, dashed: ground to device</text>
  <rect class="kernel" x="45" y="376" width="22" height="16" rx="4"/>
  <text class="label" x="75" y="389">made by the kernel</text>
  <rect class="socket" x="260" y="376" width="22" height="16" rx="4"/>
  <text class="label" x="290" y="389">opened by tcspecial</text>
  <rect class="ground" x="470" y="376" width="22" height="16" rx="4"/>
  <text class="label" x="500" y="389">the ground</text>
</svg>
