# A comparison against a setpoint, with a band around it.
node: hysteresis
type: compute
about: >
  Switches at a setpoint, with a band either side so it does not
  chatter.
sets:
  function: hysteresis
payload-sink: true
payload-source: true
moc-sink: true
moc-source: true
attributes:
  - name: setpoint
    required: true
    about: What the reading is held at.
  - name: half_band
    required: true
    about: >
      How far from the setpoint the decision changes, each way: it switches
      off this far above and on this far below. More than nought, a band of
      nothing being a bare comparison that cycles a relay on a wobble.
