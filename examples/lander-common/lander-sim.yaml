# yaml-language-server: $schema=../../tcsprotocol/schema/tcspecial-sim.schema.json

# The lander example's simulator file, shared by its two configurations,
# lander-a, which flies the X axis, and lander-b, which flies the Y axis:
# one tcs-sim simulates the payloads of both, in one world, with
#
#   tcs-sim --simulate=all \
#       --simulator=examples/lander-common/lander-sim.yaml \
#       examples/lander-a/lander-a.ytcs examples/lander-b/lander-b.ytcs
#
# Each payload says whose it is, by its configuration, so that a tool
# reading this file with one of them takes that one's payloads alone.
#
# The world is the lander and the joystick it is flown with, from tcs-sim's
# lander window. The landscape here is the one shipped; the lander example's
# ground station makes one at random for each run, from a seed, and writes it
# into that run's copy of this file. See docs/lander-design.rst.

description: Simulator settings for the lander example's two configurations

tcs-sim:
  ready: "127.0.0.1:7914"

world:
  physics:
    components:
      - type lander:
          - component: lander
            # 5500 kg empty and 500 kg of fuel. A full push gives 8 m/s2 up,
            # from the engine on its bottom -- there is nothing on its top to
            # push it down -- and 2 m/s2 across with a full tank, and more as
            # it empties; full thrust up empties it in about 32 s.
            dry_mass: "5500 kg"
            fuel: "500 kg"
            isp: "311 s"
            thrust_x: "12000 N"
            thrust_y: "48000 N"
            gravity: "1.62 m/s2"
            # The upper left, wholly in view.
            x: "60 m"
            y: "540 m"
            width: "1000 m"
            height: "600 m"
            ground: "0,210 90,300 180,170 300,240 405,80 495,80 600,190
              720,120 850,330 1000,200 m"
            pad: "405,80 495,80 m"
            # A body with its corners cut, a cabin on it with an antenna, a
            # nozzle under it, and two splayed legs, each with a strut and a
            # foot: forty-five metres wide and as tall, about a thirteenth
            # of the display's height, its feet at nought. The pad is twice
            # as wide.
            outline: "-13.5,13.5 13.5,13.5 16.5,16.5 16.5,24 13.5,27 -13.5,27
              -16.5,24 -16.5,16.5 -13.5,13.5 | -9,27 -10.5,33 -6,39 6,39
              10.5,33 9,27 | 0,39 0,45 | -3,45 3,45 | -3.75,13.5 -5.25,8.25
              5.25,8.25 3.75,13.5 | -16.5,19.5 -20.25,3 | -13.5,13.5 -20.25,3
              | -22.5,0 -18,0 -20.25,3 -22.5,0 | 16.5,19.5 20.25,3 | 13.5,13.5
              20.25,3 | 22.5,0 18,0 20.25,3 22.5,0 m"
            # The Apollo lunar module's touchdown limits.
            landing_speed: "3.05 m/s"
            landing_drift: "1.22 m/s"
            pause: "5 s"
      - type joystick_3_4:
          - component: joystick_3_4

simulated_payload_groups:
  - group: readings
    enable: true
    packet_interval: 100 ms
    protocol: udp
    simulate: true

simulated_payloads:
  - type network:
      - payload: x
        configuration: lander-a
        connects: lander.x
        group: readings
      - payload: velocity_x
        configuration: lander-a
        connects: lander.velocity_x
        group: readings
      - payload: accel_x
        configuration: lander-a
        connects: lander.acceleration_x
        group: readings
      - payload: fuel
        configuration: lander-a
        connects: lander.fuel
        group: readings
      - payload: joystick_3_4_x
        configuration: lander-a
        connects: joystick_3_4.x
        group: readings
        packet_interval: 50 ms
      - payload: thruster_x
        configuration: lander-a
        connects: lander.throttle_x
        enable: true
        protocol: udp
        simulate: true
      # What the ground's autorestart buttons reach, through lander-a's
      # gateway: 1 lets the lander start again by itself after a crash, 0,
      # as it is until told, keeps it down until it is restarted. A landing
      # does not end a flight, so neither touches a landed lander.
      - payload: autorestart
        configuration: lander-a
        connects: lander.autorestart
        enable: true
        protocol: udp
        simulate: true
      # What the ground's Demo On and Demo Off reach, through lander-a's
      # gateway_demo: 1 puts the lander in demonstration mode, in which it
      # always starts again by itself after a crash, and tcs-sim's window
      # says so and leaves only Pause working; 0, as it is until told, takes
      # it out.
      - payload: demo
        configuration: lander-a
        connects: lander.demo
        enable: true
        protocol: udp
        simulate: true
      # The lander's sky, four stars a packet, round and round, until the
      # ground has every star and quenches it through lander-a's
      # gateway_sky, driving sky_quench to the sky's generation.
      - payload: sky
        configuration: lander-a
        connects: lander.sky
        enable: true
        packet_interval: 50 ms
        protocol: udp
        simulate: true
      - payload: sky_quench
        configuration: lander-a
        connects: lander.sky_quench
        enable: true
        protocol: udp
        simulate: true
      - payload: y
        configuration: lander-b
        connects: lander.y
        group: readings
      - payload: velocity_y
        configuration: lander-b
        connects: lander.velocity_y
        group: readings
      - payload: accel_y
        configuration: lander-b
        connects: lander.acceleration_y
        group: readings
      - payload: joystick_3_4_y
        configuration: lander-b
        connects: joystick_3_4.y
        group: readings
        packet_interval: 50 ms
      - payload: thruster_y
        configuration: lander-b
        connects: lander.throttle_y
        enable: true
        protocol: udp
        simulate: true
      - payload: landed
        configuration: lander-b
        connects: lander.landed
        group: readings
      - payload: crashed
        configuration: lander-b
        connects: lander.crashed
        group: readings
      # What the ground's Restart reaches, through lander-b's gateway: a
      # count, each new one starting the lander again.
      - payload: restart
        configuration: lander-b
        connects: lander.restart
        enable: true
        protocol: udp
        simulate: true
