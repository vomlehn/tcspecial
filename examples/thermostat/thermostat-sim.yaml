# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of thermostat.yaml.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated.
#
# The three sensors report a thermal mass rather than noise, which is what
# makes the vehicle's half of the loop watchable: three readings of one
# temperature agree, so the vote produces a temperature and the thermostat
# decides on it.
#
# The heaters are discrete lines on the kernel's gpio-sim, which the vehicle
# drives and tcssim watches: each time the vehicle switches them, their panel
# counts it. They are not attached to the mass, so what the mass does is cool
# towards its environment, and what the example shows is the vehicle deciding
# to heat it. Saying heats: cabin, with a rate, on each would close the loop.
description: Simulator settings for the payloads of thermostat.yaml

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7907"

thermal_mass:
  # The cabin: ten kelvin below the setpoint of thermostat.yaml, losing the
  # difference with a fifty second constant -- which at the setpoint is a
  # fifth of a kelvin a second of cooling.
  - name: cabin
    environment: "283.15"
    time_constant: "50 s"

simulated_payload_groups:
  # The three sensors are read together, every tenth of a second, as their
  # payload group in thermostat.yaml says. Each reports the cabin, in the
  # encoding the to_kelvin node its readings go to expects: this file says
  # nothing about the format, the scale or the offset, because a scale written
  # in two files is a scale that can disagree with itself.
  - name: cabin_temps
    simulate: true
    packet_interval: 100 ms
    reads: cabin

simulated_payloads:
  - name: temp_1
    type: i2c
    group: cabin_temps

  - name: temp_2
    type: i2c
    group: cabin_temps

  - name: temp_3
    type: spi
    group: cabin_temps

  # Driven and never read: their stand-ins send nothing and count each time
  # the vehicle moves their lines.
  - name: heaters_1
    simulate: true
    type: gpio

  - name: heaters_2
    simulate: true
    type: gpio
