# yaml-language-server: $schema=../../tcsprotocol/schema/tcspecial-sim.schema.json

# How tcs-sim simulates the payload of iio.ytcs.
description: Simulator settings for the payload of iio.ytcs

# The run's simulation mode, which tcspecial, tcs-sim and tcs-moc all read
# here: all, every payload a simulated or dummy device, as on a desk with no
# hardware. See "Simulation Modes" in docs/tcspecial-design.rst.
tcspecial:
  simulate: all

# Where tcs-sim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcs-sim:
  ready: "127.0.0.22:7911"

simulated_payloads:
  - type iio:
      # Where the path is the kernel's iio_dummy sensor, a dummy device
      # bin/mk-kernel-dummies makes, the kernel fills its buffer from a timer
      # and tcs-sim makes nothing; anywhere else, tcs-sim puts a simulated
      # device, a pseudo-terminal, at the path and writes a sample set a
      # second to it.
      - payload: sensor
        packet_interval: 1 s
        simulate: true
