<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1030" viewBox="0 0 1110 1030" role="img" aria-labelledby="title desc">
  <title id="title">The lander example: lander-a, the X axis</title>
  <desc id="desc">lander-a, one of the lander example's two tcspecials, flying the X axis. Each payload at the left is a UDP socket tcs-sim simulates, joined to the lander or the joystick in tcs-sim's world; each reading is made a value by a to_value node and sent to the gateway, which takes it down through Yamcs. to_joystick_3_4_x also drives thruster_x, the dashed line, so the pilot's joystick is the thrust on the X axis. The gateway passes what the ground sends it to autorestart, the dashed line from it, which lets the lander start again by itself after a crash, or keeps it down until it is restarted. sky sends the lander's stars down, a few to a packet, round and round; gateway_sky passes the ground's quench to sky_quench, the dashed line from it, which stops them once the ground has every one. gateway_demo passes the ground's Demo On and Demo Off to demo, the dashed line from it, which puts the lander in demonstration mode or takes it out.</desc>
