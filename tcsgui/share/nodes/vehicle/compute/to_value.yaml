# A sensor's raw bytes, scaled and offset into a value in a unit.
node: to_value
type: compute
about: >
  Reads a part's bytes as a number and scales it into a value in the unit it
  names: volts, amperes, metres. A temperature is a to_kelvin.
sets:
  function: to_value
payload-sink: true
payload-source: true
gateway-sink: true
gateway-source: true
attributes:
  - name: type-in
    required: true
    about: >
      The whole number its sensor sends: u8, i8, u16, i16, u32 or i32.
  - name: scale
    required: true
    about: >
      What one count is worth, in the unit. Nought would make every reading
      the same.
  - name: offset
    required: true
    about: What is added after scaling, in the unit.
  - name: type-out
    required: true
    about: >
      The value type it sends: kelvin, volt, ampere, watt, metre, metre_per_second, newton,
      kilogram_per_second or ratio for a
      fraction of a whole.
