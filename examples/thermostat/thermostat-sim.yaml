# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of thermostat.ytcs.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated.
#
# The three sensors report a thermal mass rather than noise, which is what
# makes the vehicle's half of the loop watchable: three readings of one
# temperature agree, so the vote produces a temperature and the thermostat
# decides on it.
#
# The heaters are UDP sockets, which the vehicle drives and tcssim watches:
# each decision the vehicle sends them, their panel counts, and the mass is
# warmed through the input each is on. So the loop closes through tcspecial:
# the sensors report the mass, the vehicle decides, and the heaters warm it.
#
# To close it in tcssim alone, with no tcspecial running, add
# "thermostat: thermostat" to the tcssim section below: tcssim then stands in
# for the hysteresis node of that name, with its setpoint and band. Never
# with tcspecial running, whose own thermostat switches the same heaters.
description: Simulator settings for the payloads of thermostat.ytcs

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7907"

thermal_mass:
  # The cabin: ten kelvin below the setpoint of thermostat.ytcs, losing the
  # difference with a fifty second constant -- which at the setpoint is a
  # fifth of a kelvin a second of cooling. A heater is connected to an input
  # and a sensor to an output, and any of them may be left unconnected.
  - name: basic
    environment: "283.15"
    time_constant: "50 s"
    inputs: "in1,in2"
    outputs: "out1,out2,out3"

simulated_payload_groups:
  # The three sensors are read together, every tenth of a second, as their
  # payload group in thermostat.ytcs says. Each reports the mass, in the
  # encoding the to_kelvin node its readings go to expects: this file says
  # nothing about the format, the scale or the offset, because a scale written
  # in two files is a scale that can disagree with itself.
  - name: cabin_temps
    simulate: true
    packet_interval: 100 ms
    reads: basic

simulated_payloads:
  # Each sensor on an output of its own.
  - name: temp_1
    type: network
    protocol: udp
    group: cabin_temps
    output: out1

  - name: temp_2
    type: network
    protocol: udp
    group: cabin_temps
    output: out2

  - name: temp_3
    type: network
    protocol: udp
    group: cabin_temps
    output: out3

  # Driven and never read: their stand-ins send nothing, count each decision
  # the vehicle sends them, and warm the mass while on.
  - name: heaters_1
    simulate: true
    type: network
    protocol: udp
    heats: basic
    input: in1
    rate: "3.0"

  - name: heaters_2
    simulate: true
    type: network
    protocol: udp
    heats: basic
    input: in2
    rate: "3.0"
