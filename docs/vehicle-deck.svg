<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-labelledby="title desc">
  <title id="title">The whole deck, its subsystems opened</title>
  <desc id="desc">The deck of stages 9 and 10 with both included files drawn open. Payloads are on the left, computations in the middle, and the gateway node on the right, tall, with every reading for the ground arriving at it. In the science box: the seismometer sends to the gateway and to science_log; regolith_thermometer sends to regolith_kelvin, which sends to the gateway, to science_log and to probe_thermostat; probe_thermostat's decision goes back, dashed, to probe_heater, which reports to the gateway. A dotted line from the gateway to probe_thermostat is the command binding that lets the ground set its setpoint. In the thermal box: three hull_temp sensors each feed a hull_kelvin conversion, each conversion sends to the gateway and to hull_temp, a vote, which sends to the gateway. Below both, the camera, an app node running camera.py, sends to the gateway.</desc>
