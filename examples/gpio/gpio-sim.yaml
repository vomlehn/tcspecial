# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of gpio.ytcs.
description: Simulator settings for the payloads of gpio.ytcs

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7910"

# tcssim moves the lines of the kernel's gpio-sim chip, which it finds and
# does not make: bin/mk-kernel-stand-ins makes it, and gives its lines to the
# user who ran that.
simulated_payloads:
  # The switch is pulled the other way every second, so that its line has an
  # edge, and the ground a record, a second.
  - name: switch
    simulate: true
    type: gpio
    packet_interval: 1 s
  # Driven and never read: its stand-in watches the line and counts each
  # change the vehicle drives it to, so that its panel shows each command
  # reaching it.
  - name: lamp
    simulate: true
    type: gpio
