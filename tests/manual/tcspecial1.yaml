# The payloads tcsmoc controls and tcssim simulates.
#
# This file describes the payloads themselves: which data handlers exist, how
# tcspecial reaches each one, and how big its packets are. It deliberately says
# nothing about how fast a simulated payload produces them or how the simulator
# divides a packet into segments; those are properties of the simulation rather
# than of the payload, and live in tcspecial1sim.yaml.
#
# A data handler takes its attributes from the group it names, and may then
# override any of them for itself.
#
# oc_address and oc_port are the UDP address the handler exchanges payload data
# with the OC on, which is a different thing from the address it reaches its
# payload at. Every handler here shares the address and has a port of its own,
# numbered to match its dh_id.
version: "1.0"
description: TCSpecial payload set 1

# What tcspecial itself is configured with for this payload set -- the same
# section a tcspecial.yaml holds. First, because it is about the set as a
# whole rather than about any payload in it. Read by nothing yet: tcspecial
# still takes its own configuration from the file TCSPECIAL_CONFIG_PATH names,
# and the address it serves commands on from its command line before that.
tcspecial:
  address: 0.0.0.0
  port: 4000
  protocol: udp
  beacon_interval_ms: 5000
  beacon_address: "239.255.0.1:5550"
  beacon_interface: "127.0.0.1"
  log_dir: /var/log/tcspecial
  log_segment_bytes: 65536

payload_groups:
  # DH1 and DH3 are reached the same way: a UDP socket on this host. What
  # tells them apart is their port and packet size, so those stay with the
  # handlers and everything they share is here.
  - name: udp_localhost
    type: network
    protocol: udp
    address: localhost

payloads:
  - dh_id: 0
    name: DH0
    oc_address: 127.0.0.1
    oc_port: 6000
    type: network
    protocol: tcp
    address: localhost
    port: 5000
    packet_size: 12

  - dh_id: 1
    name: DH1
    oc_address: 127.0.0.1
    oc_port: 6001
    group: udp_localhost
    port: 5001
    packet_size: 11

  - dh_id: 2
    name: DH2
    oc_address: 127.0.0.1
    oc_port: 6002
    type: device
    path: /dev/urandom
    packet_size: 1

  - dh_id: 3
    name: DH3
    oc_address: 127.0.0.1
    oc_port: 6003
    group: udp_localhost
    port: 5003
    packet_size: 15
