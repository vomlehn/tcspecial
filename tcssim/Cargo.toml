[package]
name = "tcssim"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "TCSpecial Payload Simulator GUI"
build = "build.rs"

[dependencies]
tcslibgs = { path = "../tcslibgs" }
# Asked about the pair before anything opens: see main.
tcsverify = { path = "../tcsverify" }
# How a harness waits for a simulator to be ready, which --wait is.
tcslib = { path = "../tcslib" }
slint = "1.3"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
#log = "0.4"
#env_logger = "0.10"
rand = "0.8"

[dev-dependencies]
# Lays the window out headlessly, so a test can measure it. Slint's own
# testing backend; it uses real font metrics unless a component asks for the
# fixed test font, which none of these do.
i-slint-backend-testing = "1.18"
# Directories and files a test can make and have cleaned up after it.
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.3"
