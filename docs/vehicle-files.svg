<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The deck's files</title>
  <desc id="desc">On the left, the top files of stages 7 and 8, each holding the tcspecial section, an include list and the gateway node. On the right, the three files they include from common: science, science-logged and thermal, each giving its exports, the nodes a line from another file may reach. Stage 7 includes science and thermal, drawn with solid lines; stage 8 includes science-logged and thermal, drawn with dashed lines. The one line that differs between the two top files is the science path, shown in bold. science-logged holds the same five nodes as science, and science_log besides. Below: an included file has no tcspecial section and includes no others, and a line from another file may reach only a node its exports list.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .file { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .code { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; white-space: pre; }
      .new { font-weight: bold; fill: #111827; }
      .label { font-size: 13px; fill: #1f2937; }
      .small { font-size: 12px; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .bar { fill: #374151; }
      .seven { stroke: #0072B2; stroke-width: 2.5; fill: none; }
      .eight { stroke: #D55E00; stroke-width: 2.5; fill: none; stroke-dasharray: 9 6; }
    </style>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <marker id="vermillion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <rect class="card" x="30" y="40" width="330" height="166" rx="6"/>
  <rect class="bar" x="30" y="40" width="330" height="26" rx="6"/>
  <text class="file" x="40" y="58">stage-07/deck.ytcs</text>
  <text class="code" x="42" y="86">tcspecial:  ...</text>
  <text class="code" x="42" y="104">include:</text>
  <text class="code" x="42" y="122">  - subdiagram: science</text>
  <text class="code" x="42" y="140">    path: ../common/science</text>
  <text class="code" x="42" y="158">  - subdiagram: thermal</text>
  <text class="code" x="42" y="176">    path: ../common/thermal</text>
  <text class="code" x="42" y="194">gateways:   gateway</text>
  <rect class="card" x="30" y="270" width="330" height="186" rx="6"/>
  <rect class="bar" x="30" y="270" width="330" height="26" rx="6"/>
  <text class="file" x="40" y="288">stage-08/deck.ytcs</text>
  <text class="code" x="42" y="316">tcspecial:  ...</text>
  <text class="code" x="42" y="334">include:</text>
  <text class="code" x="42" y="352">  - subdiagram: science</text>
  <text class="code new" x="42" y="370">    path: ../common/science-logged</text>
  <text class="code" x="42" y="388">  - subdiagram: thermal</text>
  <text class="code" x="42" y="406">    path: ../common/thermal</text>
  <text class="code" x="42" y="424">gateways:   gateway</text>
  <text class="small" x="42" y="446">the one line stage 8 changes, in bold</text>
  <rect class="card" x="510" y="20" width="360" height="112" rx="6"/>
  <rect class="bar" x="510" y="20" width="360" height="26" rx="6"/>
  <text class="file" x="520" y="38">common/science.ytcs</text>
  <text class="code" x="522" y="66">exports:</text>
  <text class="code" x="522" y="84">  world-out: [probe_heater,</text>
  <text class="code" x="522" y="102">    regolith_kelvin, seismometer]</text>
  <text class="code" x="522" y="120">5 nodes, 1 command binding</text>
  <rect class="card" x="510" y="170" width="360" height="112" rx="6"/>
  <rect class="bar" x="510" y="170" width="360" height="26" rx="6"/>
  <text class="file" x="520" y="188">common/science-logged.ytcs</text>
  <text class="code" x="522" y="216">exports:</text>
  <text class="code" x="522" y="234">  world-out: [probe_heater,</text>
  <text class="code" x="522" y="252">    regolith_kelvin, seismometer]</text>
  <text class="code new" x="522" y="270">the same 5 nodes, and science_log</text>
  <rect class="card" x="510" y="330" width="360" height="112" rx="6"/>
  <rect class="bar" x="510" y="330" width="360" height="26" rx="6"/>
  <text class="file" x="520" y="348">common/thermal.ytcs</text>
  <text class="code" x="522" y="376">exports:</text>
  <text class="code" x="522" y="394">  world-out: [hull_kelvin_1, hull_kelvin_2,</text>
  <text class="code" x="522" y="412">    hull_kelvin_3, hull_temp]</text>
  <text class="code" x="522" y="430">7 nodes</text>
  <path class="seven" d="M360,135 L440,135 L440,80 L502,80" marker-end="url(#blue)"/>
  <path class="seven" d="M360,171 L460,171 L460,388 L502,388" marker-end="url(#blue)"/>
  <path class="eight" d="M360,365 L420,365 L420,230 L502,230" marker-end="url(#vermillion)"/>
  <path class="eight" d="M360,401 L480,401 L480,410 L502,410" marker-end="url(#vermillion)"/>
  <path class="seven" d="M30,474 L80,474"/>
  <text class="small" x="88" y="478" text-anchor="start">solid: stage 7 includes</text>
  <path class="eight" d="M260,474 L310,474"/>
  <text class="small" x="318" y="478" text-anchor="start">dashed: stage 8 includes</text>
  <text class="small" x="30" y="506" text-anchor="start">An included file has no tcspecial section and includes no others. A line from another file may reach only a node its exports list.</text>
</svg>
