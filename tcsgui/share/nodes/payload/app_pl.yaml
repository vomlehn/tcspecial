# A payload that is a program and is never asked: it reports of its own accord.
#
# A payload: what the vehicle carries this flight, and this one is a program
# the mission wrote rather than a device on a bus. Its readings leave by
# payload-out on their way to the ground, and nothing arrives: it is the one
# node type with no data sink at all, because there is nothing to ask it with
# -- it samples on a clock of its own, or reports when something happens, and
# what decides is in the program. It is run with one file interface, which it
# only writes. The interfaces and the packets they carry are tcsapp; its Rust
# is tcspecial/src/node/payload/app_pl/.
node: app_pl
type: app_pl
about: >
  A payload of its own making: a program that writes readings and is asked
  nothing.
payload-sink: false
payload-source: true
gateway-sink: false
gateway-source: false
attributes:
  - name: executable
    required: true
    kind: path
    about: >
      Where the application is. It is started when the configuration is
      loaded, so one that cannot be executed is a fault found on the ground,
      and it is run with this node's name as its first argument. A leading `~`
      and `$HOME` are expanded as a shell would expand them, against the home
      directory of whatever runs the application: so the value is kept as
      written and what it stands for is settled aboard.
  - name: app-payload-arg
    required: true
    about: >
      What the program is told about the payload stream, as the argument after
      the node's name. Required: the arguments are a fixed list, so a node that
      said nothing would shift what the rest of the list means.
  - name: restart
    required: false
    kind: boolean
    about: >
      Whether it is started again when it stops: true or false. A node that
      says nothing is a node left stopped, which is the answer a part of a
      control path wants.
