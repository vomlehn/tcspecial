<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="790" viewBox="0 0 1260 790" role="img" aria-labelledby="title desc">
  <title id="title">The thermostat example</title>
  <desc id="desc">Three temperature sensors, temp_fore and temp_aft on I2C and temp_bay on SPI, read together every three seconds as the group cabin_temps. Each reading is converted to kelvin by k_fore, k_aft and k_bay, and each converted reading goes to the moc node, to mean_temp as input in0, in1 or in2, and to the log housekeeping. mean_temp goes to the moc node and to thermostat, a hysteresis that drives the GPIO heaters and is logged. The moc node binds 127.0.0.1:5000 and sends to the ground station at its ground_address and ground_port, 127.0.0.1:5100. The ground sets the thermostat's setpoint through a command binding on the moc node.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .port { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #6b21a8; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .payload { fill: #eaf2fb; stroke: #2f6db5; stroke-width: 1.6; }
      .vehicle { fill: #f5f0fc; stroke: #7e57c2; stroke-width: 1.6; }
      .moc { fill: #e9f6ee; stroke: #2e7d4f; stroke-width: 1.6; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .groundward { fill: none; stroke: #2563eb; stroke-width: 1.8; }
      .vehicleward { fill: none; stroke: #d97706; stroke-width: 2; }
      .command { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1260" height="790" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="60" y="40">PAYLOADS</text>
  <text class="heading" x="1040" y="40">GROUND</text>

  <!-- tcspecial, the vehicle -->
  <rect class="boundary" x="270" y="52" width="710" height="580" rx="16"/>
  <text class="heading" x="290" y="78">TCSPECIAL (VEHICLE)</text>

  <!-- The group the three sensors are read in -->
  <rect class="group" x="50" y="88" width="192" height="344" rx="12"/>
  <text class="note" x="58" y="448">group cabin_temps,</text>
  <text class="note" x="58" y="464">read every 3 s</text>

  <!-- Payloads -->
  <rect class="payload" x="60" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="124">temp_fore</text>
  <text class="kind" x="74" y="144">I2C, address 0x48</text>
  <text class="detail" x="74" y="162">/dev/i2c-1</text>

  <rect class="payload" x="60" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="244">temp_aft</text>
  <text class="kind" x="74" y="264">I2C, address 0x49</text>
  <text class="detail" x="74" y="282">/dev/i2c-1</text>

  <rect class="payload" x="60" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="364">temp_bay</text>
  <text class="kind" x="74" y="384">SPI</text>
  <text class="detail" x="74" y="402">/dev/spidev0.0</text>

  <rect class="payload" x="60" y="500" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="524">heaters</text>
  <text class="kind" x="74" y="544">GPIO output</text>
  <text class="detail" x="74" y="562">lines 3,4,5</text>

  <!-- Conversions -->
  <rect class="vehicle" x="300" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="124">k_fore</text>
  <text class="kind" x="314" y="144">compute, to_kelvin</text>
  <text class="detail" x="314" y="162">i16_be</text>

  <rect class="vehicle" x="300" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="244">k_aft</text>
  <text class="kind" x="314" y="264">compute, to_kelvin</text>
  <text class="detail" x="314" y="282">i16_be</text>

  <rect class="vehicle" x="300" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="364">k_bay</text>
  <text class="kind" x="314" y="384">compute, to_kelvin</text>
  <text class="detail" x="314" y="402">u24_be</text>

  <!-- The mean, with its three named inputs -->
  <rect class="vehicle" x="540" y="220" width="170" height="80" rx="10"/>
  <text class="name" x="574" y="244">mean_temp</text>
  <text class="kind" x="574" y="264">compute, mean</text>
  <text class="port" x="546" y="236">in0</text>
  <text class="port" x="546" y="261">in1</text>
  <text class="port" x="546" y="286">in2</text>

  <!-- The log -->
  <rect class="vehicle" x="540" y="470" width="170" height="74" rx="10"/>
  <text class="name" x="554" y="494">housekeeping</text>
  <text class="kind" x="554" y="514">log</text>
  <text class="detail" x="554" y="532">/tmp/telemetry</text>

  <!-- The ground link -->
  <rect class="moc" x="780" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="794" y="124">moc</text>
  <text class="kind" x="794" y="144">ground link</text>
  <text class="detail" x="794" y="162">binds 127.0.0.1:5000</text>

  <!-- The thermostat -->
  <rect class="vehicle" x="780" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="794" y="364">thermostat</text>
  <text class="kind" x="794" y="384">compute, hysteresis</text>
  <text class="detail" x="794" y="402">293.15 K, ±2.0</text>

  <!-- The ground station -->
  <rect class="ground" x="1040" y="100" width="180" height="474" rx="10"/>
  <text class="name" x="1054" y="124">MOC</text>
  <text class="kind" x="1054" y="144">ground station</text>
  <text class="note" x="1054" y="178">listens for moc on</text>
  <text class="detail" x="1054" y="196">127.0.0.1:5100</text>


  <!-- Sensors to their conversions -->
  <path class="groundward" d="M230,137 L296,137" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,257 L296,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,377 L296,377" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion to the ground link -->
  <path class="groundward" d="M470,116 L776,116" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,238 C505,238 505,131 540,131 L776,131" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,358 C512,358 512,146 548,146 L776,146" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion into the mean, by name -->
  <path class="groundward" d="M470,137 C505,137 505,232 536,232" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,257 L536,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,377 C505,377 505,282 536,282" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion into the log -->
  <path class="groundward" d="M470,158 C498,158 498,484 536,484" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,278 C494,278 494,500 536,500" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,398 C490,398 490,516 536,516" marker-end="url(#arrow-blue)"/>

  <!-- The mean to the ground link and to the thermostat -->
  <path class="groundward" d="M710,240 C745,240 745,161 776,161" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M710,280 C745,280 745,377 776,377" marker-end="url(#arrow-blue)"/>

  <!-- The thermostat's decision, logged -->
  <path class="groundward" d="M780,400 C745,400 745,527 714,527" marker-end="url(#arrow-blue)"/>

  <!-- The thermostat drives the heaters -->
  <path class="vehicleward" d="M865,414 L865,586 L145,586 L145,578" marker-end="url(#arrow-orange)"/>
  <text class="label" x="672" y="578">moc-out: on below the band</text>

  <!-- The ground sets the setpoint -->
  <path class="command" d="M865,174 L865,336" marker-end="url(#arrow-orange)"/>
  <text class="label" x="875" y="252">command:</text>
  <text class="label" x="875" y="268">sets setpoint</text>

  <!-- The ground link to and from the ground -->
  <path class="groundward" d="M950,128 L1036,128" marker-end="url(#arrow-blue)"/>
  <path class="vehicleward" d="M1040,152 L954,152" marker-end="url(#arrow-orange)"/>

  <!-- Legend -->
  <line x1="50" y1="678" x2="1220" y2="678" stroke="#e5e7eb" stroke-width="1"/>
  <path class="groundward" d="M50,710 L100,710" marker-end="url(#arrow-blue)"/>
  <text class="label" x="110" y="714">data link, toward the ground</text>
  <path class="vehicleward" d="M330,710 L380,710" marker-end="url(#arrow-orange)"/>
  <text class="label" x="390" y="714">data link, toward the vehicle</text>
  <path class="command" d="M610,710 L660,710" marker-end="url(#arrow-orange)"/>
  <text class="label" x="670" y="714">command binding</text>
  <rect class="payload" x="50" y="740" width="22" height="16" rx="4"/>
  <text class="label" x="80" y="753">payload</text>
  <rect class="vehicle" x="170" y="740" width="22" height="16" rx="4"/>
  <text class="label" x="200" y="753">vehicle node</text>
  <rect class="moc" x="320" y="740" width="22" height="16" rx="4"/>
  <text class="label" x="350" y="753">moc node</text>
  <rect class="ground" x="450" y="740" width="22" height="16" rx="4"/>
  <text class="label" x="480" y="753">ground program</text>
  <rect class="group" x="620" y="740" width="22" height="16" rx="4"/>
  <text class="label" x="650" y="753">payload group</text>
</svg>
