# The command interpreter's own configuration.
#
# Read by tcspecial at startup, from the path TCSPECIAL_CONFIG_PATH names when
# it is set. Nothing about the payloads is here: which data handlers exist and
# how to reach them is a payload configuration, named on tcspecial's command
# line.
#
# This is parsed as YAML because it is named .yaml. Every configuration file in
# the project chooses its parser from its extension, so the same settings in a
# .json or .xml file would be read just as well.
#
# Note the quotes on the address: unquoted, 0.0.0.0 is a string in YAML only
# because it happens not to be a number, which is a thin reason to rely on.
address: "0.0.0.0"
port: 4000
protocol: udp

# How often beacons go out and where they go. Both are required of every
# command interpreter configuration, here and in the tcspecial section of a
# payload configuration file: beacons are how the ground knows the spacecraft
# is alive, so neither is a question to leave to a default that a file
# silently takes.
#
# A payload set's section states them for that set and wins over these. These
# are what place a set that has no such section -- one written in the endpoint
# configuration language, which has no place to put them.
#
# The address is a multicast group, which is what a beacon wants: any number of
# ground stations join it, and neither end needs the other's address. The
# interface is the local one both ends use -- 127.0.0.1 because tcsmoc and
# tcspecial are run on one machine here. Both read it from this file, which is
# how they come to name the same one; a sender and a listener on different
# interfaces lose every beacon with nothing to say so.
beacon_interval_ms: 5000
beacon_address: "239.255.0.1:5550"
beacon_interface: "127.0.0.1"
log_dir: telemetry
log_segment_bytes: 65536
