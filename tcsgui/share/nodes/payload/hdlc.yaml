# A synchronous line, framed: a radio or a bus bridge.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at gateway-in. Its Rust is
# tcspecial/src/node/payload/hdlc/.
node: hdlc
type: hdlc
about: >
  A synchronous line, framed: a radio or a bus bridge.
payload-sink: false
payload-source: true
gateway-sink: true
gateway-source: false
attributes:
  - name: interface
    required: true
    about: >
      The network interface the line appears as: hdlc0.
  - name: standard
    required: true
    about: Which framing the line uses, there being no negotiation on one.
  - name: clock_type
    required: true
    about: >
      Which end generates the clock: this one, the far one, or neither.
  - name: clock_rate
    required: false
    kind: whole
    about: >
      The clock rate, which is required only where this end generates it.
  - name: encoding
    required: false
    about: How the bits are encoded on the line.
  - name: frame_check
    required: false
    about: Which frame check sequence the frames carry.
  - name: loopback
    required: false
    kind: boolean
    about: >
      Whether the interface is put in loopback, for a bench test with
      nothing on the far end.
  - name: group
    required: false
    about: >
      The payload group that reads it, where it is in one. Optional, though a
      payload that states a trigger needs one: the interval of its group is
      how often it is asked.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer: "READ\r", [55], or parts of both one
      after another, "AT" [0D 0A]. A payload with none is one the
      configuration describes as only read.
  - name: trigger_interval
    required: false
    kind: interval
    about: >
      How often the trigger goes out, which is how often this payload is
      asked: 500 ms, 3 s. Said by a payload that has a trigger and is in no
      group; a payload in one is asked when its group is read.
  - name: read_delay
    required: false
    kind: interval
    about: >
      How long to wait between asking and reading, which is what the part
      takes to answer: 2 ms, 200 us. With one, a pass asks, waits and reads
      the answer to the question it asked; with none, a pass reads what the
      last ask produced and asks again. Only beside a trigger.
  - name: poll_interval
    required: false
    kind: interval
    about: >
      The least time between one read of it and the next, for a payload
      nothing asks: 1 s, 500 ms. A floor rather than a rate -- nothing says
      how soon there will be anything to read -- said by a payload with no
      trigger that is in no group, and never beside a trigger.
  - name: init
    required: false
    kind: bytes
    about: >
      What to write to it as the vehicle opens it -- at startup, and whenever
      the ground starts it again -- written as a trigger is: a C string in
      quotes, bytes in brackets, or both one after another. A heater that must
      start off, a register to set before the part reads sensibly. A write that
      fails stops the node from starting.
  - name: stand_in
    required: false
    about: >
      Where the payload is reached over UDP when it is simulated, as a
      loopback address and port: 127.0.0.1:7950. Under --simulate=some or
      all tcspecial sends to and reads from that address instead of the
      device, and tcssim answers there; under --simulate=none, the flight
      setting, it is not used and the device is opened. For the types the
      operating system has nothing faithful to stand in for.
