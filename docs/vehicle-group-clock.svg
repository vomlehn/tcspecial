<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Reading on one clock</title>
  <desc id="desc">Two timelines over ten seconds, one above the other. Above, stage 4: the seismometer's readings, drawn as circles, arrive whenever it sends them, at no regular time; the regolith thermometer, drawn as squares, is asked once a second by its own trigger_interval, three quarters of a second into each second; so no reading of one lines up with a reading of the other. Below, stage 5: the two are members of the science_readings group, whose clock ticks every second, drawn as vertical lines, and at each tick the thermometer is asked and what the seismometer has sent is taken, so each circle sits on a square. In both, the heater's report, drawn as triangles, goes once a second on its own state_interval, and the beacon, drawn as diamonds, every five seconds; a group changes neither.</desc>
