<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880" role="img" aria-labelledby="title desc">
  <title id="title">The thermostat example</title>
  <desc id="desc">Three temperature sensors of one place, temp_1, temp_2 and temp_3, read together ten times a second as the group zone_temps. Three of them, so that the temperature survives one sensor going wrong. Every sensor and heater is the far end of a UDP socket on this host, ports 5201 to 5205, which tcssim stands in for, so that the example touches no hardware. Each reading is converted to kelvin by temp1, temp2 and temp3, and each converted reading goes to the gateway node on the ground, to ambient as input in0, in1 or in2, and to the log housekeeping. ambient votes over the three, by the median, and produces one temperature on every arrival: a sensor that has gone wrong is outvoted, and one that stops reporting is outvoted too rather than stopping the vehicle from deciding anything. Its value goes to the gateway node and to the thermostat's two stages, each a hysteresis whose decision drives a heater of its own, is logged, and goes to the ground: thermostat_1, holding 293.15 K within a half-band of 2.0, drives heaters_1, on below 291.15 K and off above 295.15 K; thermostat_2, holding 290.15 K within a half-band of 1.0, drives heaters_2, on below 289.15 K and off above 291.15 K, so that the second heater comes on only when the first cannot hold the zone. Two heaters, because one failing must not leave the thermal mass with no way to be warmed. tcspecial sends what each of ambient, temp1, temp2, temp3, thermostat_1 and thermostat_2 produces as UDP datagrams to the gateway node's ground_base, 127.0.0.1:5100, plus the source's device id: port 5100 for ambient, 5105 to 5107 for the conversions, and 5111 and 5112 for the two stages. Ground software gets that data from the gateway node with a function call, tcslib's GatewayReceiver::receive. The ground sets each stage's setpoint through a command binding on the gateway node, sent to 127.0.0.1:5000.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .port { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #6b21a8; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .payload { fill: #eaf2fb; stroke: #2f6db5; stroke-width: 1.6; }
      .vehicle { fill: #f5f0fc; stroke: #7e57c2; stroke-width: 1.6; }
      .gateway { fill: #e9f6ee; stroke: #2e7d4f; stroke-width: 1.6; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .groundside { fill: #f8faf8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .call { fill: none; stroke: #374151; stroke-width: 2.4; }
      .code { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
      .portno { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #1e40af; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .groundward { fill: none; stroke: #2563eb; stroke-width: 1.8; }
      .vehicleward { fill: none; stroke: #d97706; stroke-width: 2; }
      .command { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1300" height="880" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="60" y="40">PAYLOADS</text>

  <!-- tcspecial, the vehicle -->
  <rect class="boundary" x="270" y="52" width="710" height="700" rx="16"/>
  <text class="heading" x="290" y="78">TCSPECIAL (VEHICLE)</text>

  <!-- The group the three sensors are read in -->
  <rect class="group" x="50" y="88" width="192" height="344" rx="12"/>
  <text class="note" x="58" y="448">group zone_temps,</text>
  <text class="note" x="58" y="464">read every 100 ms</text>

  <!-- Payloads -->
  <rect class="payload" x="60" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="124">temp_1</text>
  <text class="kind" x="74" y="144">network, udp</text>
  <text class="detail" x="74" y="162">127.0.0.1:5201</text>

  <rect class="payload" x="60" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="244">temp_2</text>
  <text class="kind" x="74" y="264">network, udp</text>
  <text class="detail" x="74" y="282">127.0.0.1:5202</text>

  <rect class="payload" x="60" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="364">temp_3</text>
  <text class="kind" x="74" y="384">network, udp</text>
  <text class="detail" x="74" y="402">127.0.0.1:5203</text>

  <rect class="payload" x="60" y="520" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="544">heaters_1</text>
  <text class="kind" x="74" y="564">network, udp</text>
  <text class="detail" x="74" y="582">127.0.0.1:5204</text>

  <rect class="payload" x="60" y="650" width="170" height="74" rx="10"/>
  <text class="name" x="74" y="674">heaters_2</text>
  <text class="kind" x="74" y="694">network, udp</text>
  <text class="detail" x="74" y="712">127.0.0.1:5205</text>

  <!-- Conversions -->
  <rect class="vehicle" x="300" y="100" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="124">temp1</text>
  <text class="kind" x="314" y="144">compute, to_kelvin</text>
  <text class="detail" x="314" y="162">i16_be</text>

  <rect class="vehicle" x="300" y="220" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="244">temp2</text>
  <text class="kind" x="314" y="264">compute, to_kelvin</text>
  <text class="detail" x="314" y="282">i16_be</text>

  <rect class="vehicle" x="300" y="340" width="170" height="74" rx="10"/>
  <text class="name" x="314" y="364">temp3</text>
  <text class="kind" x="314" y="384">compute, to_kelvin</text>
  <text class="detail" x="314" y="402">u24_be</text>

  <!-- The vote over the three, with its named inputs -->
  <rect class="vehicle" x="540" y="220" width="170" height="80" rx="10"/>
  <text class="name" x="574" y="244">ambient</text>
  <text class="kind" x="574" y="264">compute, vote: median</text>
  <text class="port" x="546" y="236">in0</text>
  <text class="port" x="546" y="261">in1</text>
  <text class="port" x="546" y="286">in2</text>

  <!-- The log -->
  <rect class="vehicle" x="540" y="470" width="170" height="74" rx="10"/>
  <text class="name" x="554" y="494">housekeeping</text>
  <text class="kind" x="554" y="514">log</text>
  <text class="detail" x="554" y="532">/tmp/telemetry</text>

  <!-- The thermostat's two stages, the second's band under the first's -->
  <rect class="vehicle" x="780" y="300" width="170" height="90" rx="10"/>
  <text class="name" x="794" y="324">thermostat_1</text>
  <text class="kind" x="794" y="344">compute, hysteresis</text>
  <text class="detail" x="794" y="362">setpoint 293.15 K</text>
  <text class="detail" x="794" y="380">half_band 2.0</text>
  <rect class="vehicle" x="780" y="450" width="170" height="90" rx="10"/>
  <text class="name" x="794" y="474">thermostat_2</text>
  <text class="kind" x="794" y="494">compute, hysteresis</text>
  <text class="detail" x="794" y="512">setpoint 290.15 K</text>
  <text class="detail" x="794" y="530">half_band 1.0</text>

  <!-- The ground -->
  <rect class="groundside" x="1010" y="52" width="270" height="700" rx="16"/>
  <text class="heading" x="1028" y="78">GROUND</text>

  <!-- The gateway node, on the ground -->
  <rect class="gateway" x="1030" y="96" width="230" height="110" rx="10"/>
  <text class="name" x="1044" y="120">gateway</text>
  <text class="kind" x="1044" y="140">receives what tcspecial sends</text>
  <text class="detail" x="1044" y="158">ground_base 127.0.0.1:5100</text>
  <text class="detail" x="1044" y="176">commands to 127.0.0.1:5000</text>

  <!-- The ground software -->
  <rect class="ground" x="1030" y="430" width="230" height="80" rx="10"/>
  <text class="name" x="1044" y="456">ground software</text>
  <text class="kind" x="1044" y="477">processing and display</text>
  <text class="detail" x="1044" y="496">from ambient ... thermostat_2</text>


  <!-- Sensors to their conversions -->
  <path class="groundward" d="M230,137 L296,137" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,257 L296,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M230,377 L296,377" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion to the ground link -->
  <path class="groundward" d="M470,116 L1026,116" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,238 C505,238 505,131 540,131 L1026,131" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,358 C512,358 512,146 548,146 L1026,146" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion into the vote, by name -->
  <path class="groundward" d="M470,137 C505,137 505,232 536,232" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,257 L536,257" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,377 C505,377 505,282 536,282" marker-end="url(#arrow-blue)"/>

  <!-- Each conversion into the log -->
  <path class="groundward" d="M470,158 C498,158 498,484 536,484" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,278 C494,278 494,500 536,500" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M470,398 C490,398 490,516 536,516" marker-end="url(#arrow-blue)"/>

  <!-- The vote to the ground link and to both stages -->
  <path class="groundward" d="M710,240 C745,240 745,161 780,161 L1026,161" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M710,270 C745,270 745,337 776,337" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M710,288 C735,288 735,495 776,495" marker-end="url(#arrow-blue)"/>

  <!-- Each stage's decision, to the ground link and logged -->
  <path class="groundward" d="M792,300 L792,176 L1026,176" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M950,470 L975,470 L975,248 A8,8 0 0 0 975,232 L975,191 L1026,191" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M780,358 C755,358 755,522 714,522" marker-end="url(#arrow-blue)"/>
  <path class="groundward" d="M780,522 C755,522 755,536 714,536" marker-end="url(#arrow-blue)"/>

  <!-- Each stage drives its own heater -->
  <path class="vehicleward" d="M950,350 L962,350 L962,462 A8,8 0 0 1 962,478 L962,497 A8,8 0 0 1 962,513 L962,610 L145,610 L145,598" marker-end="url(#arrow-orange)"/>
  <path class="vehicleward" d="M865,540 L865,602 A8,8 0 0 1 865,618 L865,740 L145,740 L145,728" marker-end="url(#arrow-orange)"/>
  <text class="label" x="560" y="602">gateway-out: heaters_1 on below 291.15 K</text>
  <text class="label" x="560" y="732">gateway-out: heaters_2 on below 289.15 K</text>

  <!-- Each source's port on the ground: ground_base plus its device id -->
  <text class="portno" x="985" y="113">5105</text>
  <text class="portno" x="985" y="128">5106</text>
  <text class="portno" x="985" y="143">5107</text>
  <text class="portno" x="985" y="158">5100</text>
  <text class="portno" x="985" y="173">5111</text>
  <text class="portno" x="985" y="188">5112</text>

  <!-- The ground sets each stage's setpoint -->
  <path class="command" d="M1030,198 L995,198 L995,505 L954,505" marker-end="url(#arrow-orange)"/>
  <path class="command" d="M995,240 L912,240 L912,296" marker-end="url(#arrow-orange)"/>
  <text class="label" x="802" y="262">command: sets</text>
  <text class="label" x="802" y="278">each setpoint</text>

  <!-- The ground software gets the data with a function call -->
  <path class="call" d="M1145,206 L1145,426" marker-end="url(#arrow-call)"/>
  <text class="code" x="1155" y="304">GatewayReceiver::</text>
  <text class="code" x="1155" y="320">receive()</text>

  <!-- Legend -->
  <line x1="50" y1="782" x2="1260" y2="782" stroke="#e5e7eb" stroke-width="1"/>
  <path class="groundward" d="M50,810 L100,810" marker-end="url(#arrow-blue)"/>
  <text class="label" x="110" y="814">data link, toward the ground</text>
  <path class="vehicleward" d="M330,810 L380,810" marker-end="url(#arrow-orange)"/>
  <text class="label" x="390" y="814">data link, toward the vehicle</text>
  <path class="command" d="M610,810 L660,810" marker-end="url(#arrow-orange)"/>
  <text class="label" x="670" y="814">command binding</text>
  <path class="call" d="M830,810 L880,810" marker-end="url(#arrow-call)"/>
  <text class="label" x="890" y="814">function call, from tcslib::gateway</text>
  <rect class="payload" x="50" y="840" width="22" height="16" rx="4"/>
  <text class="label" x="80" y="853">payload</text>
  <rect class="vehicle" x="170" y="840" width="22" height="16" rx="4"/>
  <text class="label" x="200" y="853">vehicle node</text>
  <rect class="gateway" x="320" y="840" width="22" height="16" rx="4"/>
  <text class="label" x="350" y="853">gateway node</text>
  <rect class="ground" x="450" y="840" width="22" height="16" rx="4"/>
  <text class="label" x="480" y="853">ground program</text>
  <rect class="group" x="620" y="840" width="22" height="16" rx="4"/>
  <text class="label" x="650" y="853">payload group</text>
</svg>
