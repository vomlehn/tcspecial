# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of thermostat.yaml.
#
# The two files are joined by name: every data handler there has an entry
# here, and nothing here names a payload that file does not have.
description: Simulator settings for the payloads of thermostat.yaml

simulated_payload_groups:
  # The three sensors are read together, every three seconds, as their
  # payload group in thermostat.yaml says.
  - name: cabin_temps
    packet_interval_ms: 3000

simulated_payloads:
  - name: temp_fore
    type: i2c
    group: cabin_temps

  - name: temp_aft
    type: i2c
    group: cabin_temps

  - name: temp_bay
    type: spi
    group: cabin_temps

  # Commanded rather than read: nothing for an interval to mean.
  - name: heaters
    type: gpio
