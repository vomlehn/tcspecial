# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim simulates the payloads of tcspecial4.yaml.
#
# Nothing here describes a payload: tcspecial4.yaml does that, and this file
# adds only what simulating one needs. The two are joined by name. Every data
# handler of the tcspecial configuration needs settings here, and a name here
# that no data handler has is an error rather than a line with no effect,
# because a typo is otherwise indistinguishable from a payload that was meant
# not to be simulated.
#
# The payload states the kind of payload it is, in the same word its own file
# uses. That is not a setting of the simulation -- the tcspecial configuration
# decides it
# -- and it is stated again here only so that the two files can be checked
# against each other: the files are joined by name alone, and a payload set
# copied from another one keeps the names.
#
# A serial payload takes no protocol and no address of its own: a line is
# reached by its device and by nothing else, and the same is true of a device
# file, a bus and a clocked link. Only the network payload states a protocol,
# and it states the one its own file states: the two are checked against each
# other rather than one being taken from the other.
#
# Read as YAML because it is named .yaml. A simulator configuration chooses
# its parser from its extension as every configuration file in this project
# does, so the same settings in an .xml file would be read just as well; the
# shipped ones are YAML because that is what carries comments.
description: Simulator settings for the payloads of tcspecial4.yaml

simulated_payloads:
  # Twice a second, in segments of four bytes a tenth of a second apart, so
  # that a packet arriving in pieces is what the panels show rather than
  # something to be imagined. A line delivers bytes rather than datagrams, so
  # the segments are where a handler's reading is exercised.
  - name: serial-line
    type: serial
    packet_interval: 500 ms
    segment_size: 4
    segment_interval: 100 ms

  # Once a second, whole. A datagram is delivered entire or not at all, so
  # segments would describe something a socket does not do.
  - name: udp-steady
    type: network
    protocol: udp
    packet_interval: 1 s

  # As fast as it will go, which for a device file means the handler sets the
  # pace: /dev/urandom is never not ready, so there is nothing to wait for.
  - name: random-device
    type: device-file
    packet_interval: continuous

  # Twice a second, whole. A simulated bus is a register rather than a
  # stream -- every master reads the same bank and bytes do not queue -- so a
  # packet sent in pieces would be a packet partly overwritten before it was
  # read, which is a property of the bus and not something to exercise here.
  - name: bus-device
    type: i2c
    packet_interval: 500 ms

  # Twice a second, in four-byte pieces, as the line is: a clocked link
  # carries bytes, so a packet arriving in pieces is a thing a handler on one
  # has to put back together.
  - name: clocked-peripheral
    type: spi
    packet_interval: 500 ms
    segment_size: 4
    segment_interval: 100 ms
