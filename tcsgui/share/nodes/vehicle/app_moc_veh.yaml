# A program of the vehicle's own that is asked and answers.
#
# The mirror of app_payload_veh: it is run with one file interface, on which it
# reads MOC data and writes payload data, so it takes what travels vehicleward
# and answers with what travels groundward. Which is the shape a payload has,
# and what an app of this kind stands in for: something that is asked for a
# reading and produces one. The interfaces and the packets they carry are
# tcsapp; its Rust is tcspecial/src/node/vehicle/app_moc_veh/.
node: app_moc_veh
type: app_moc_veh
about: >
  A program of its own: it reads MOC data and writes payload data.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: executable
    required: true
    kind: path
    about: >
      Where the application is. It is started when the configuration is
      loaded, so one that cannot be executed is a fault found on the ground,
      and it is run with this node's name as its first argument. A leading `~`
      and `$HOME` are expanded as a shell would expand them, against the home
      directory of whatever runs the application: so the value is kept as
      written and what it stands for is settled aboard.
  - name: app-moc-arg
    required: true
    about: >
      What the program is told about the MOC stream, as the argument after the
      payload one where this kind has both. Required, for the reason the
      payload argument is.
  - name: restart
    required: false
    kind: boolean
    about: >
      Whether it is started again when it stops: true or false. A node that
      says nothing is a node left stopped, which is the answer a part of a
      control path wants.
