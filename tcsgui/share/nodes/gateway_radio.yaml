# The ground station, which is the other end of the link and not part of the
# vehicle at all.
#
# Every payload aboard reports to one of these: the telemetry arrives at its
# payload-in, told apart by the payload id its socket carries, and what the
# ground sends leaves by its gateway-out. It is at the root of this tree rather
# than in a family of its own because it has no Rust of its own: a ground
# link is served by the network payload code,
# tcspecial/src/node/payload/network/.
node: gateway_radio
type: gateway_radio
about: >
  The ground station: the other end of the link, and not the vehicle.
payload-sink: true
payload-source: false
gateway-sink: false
gateway-source: true
attributes:
  - name: ground_base
    required: true
    about: >
      Where the ground station is, as address:port. What each node linked
      into this one produces is sent to that address, at that port plus the
      node's device id, from the start.
  - name: address
    required: false
    about: >
      The address tcspecial binds for what the ground sends: needed, with
      port, when commands or a line come from this node.
  - name: port
    required: false
    about: The port that goes with the address.
