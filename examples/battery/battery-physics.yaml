# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-physics.schema.json

# The physics of the battery example's vehicle: its power system, as the
# parts it is made of. The sun lights the solar array; the array supplies
# the bus, the loads draw on it, and what is left over charges the battery,
# or, in shadow, what the array cannot give the battery makes up. Named by
# battery-sim.yaml.
#
# The orbit is six minutes where a low one is ninety, and the battery a
# tenth of what a vehicle of these loads would fly, so that a run on a
# desk sees a whole orbit -- the charge, the battery full and its current
# shunted, the eclipse, the science load shed and restored -- in the time
# it takes to watch it.
description: The physics of the vehicle of battery.ytcs

physics:
  - type battery:
      # Eight lithium-ion cells in series, 24 V empty and 33.2 V full, of a
      # fifth of an ampere-hour, starting six tenths full. With both loads on
      # in shadow it would lose four fifths of its charge in an eclipse; shed
      # at three tenths, it comes through.
      - component: battery
        capacity: "0.2 Ah"
        charge: "0.6"
        empty: "24 V"
        full: "33.2 V"
        resistance: "0.05 ohm"

  - type bus:
      - component: bus

  - type load:
      # The avionics, which are never shed, and the science instrument, which
      # is: two amperes each.
      - component: avionics
        current: "2 A"

      - component: science
        current: "2 A"

  - type solar_array:
      # Seven amperes in full sunlight.
      - component: array
        current: "7 A"

  - type sun:
      # Four tenths of the orbit in the planet's shadow: two minutes and
      # twenty-four seconds dark, three minutes and thirty-six lit.
      - component: sun
        eclipse: "0.4"
        period: "6 min"

connections:
  - from: sun.light
    to: array.light
  - from: array.current
    to: bus.supply
  - from: avionics.current
    to: bus.demand
  - from: science.current
    to: bus.demand
  - from: bus.current
    to: battery.offered
