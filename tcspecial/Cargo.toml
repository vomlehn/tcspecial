[package]
name = "tcspecial"
version = "0.1.0"
edition = "2021"
license.workspace = true
# The repository's README, which is the crate's page on crates.io.
readme = "../README.md"
description = """\
TCSpecial flight software: the spacecraft's command interpreter and data \
handler manager, being integrated with NASA's cFS and JPL's F Prime"""

[dependencies]
tcslibgs = { path = "../tcslibgs" }
# The file interfaces an app node's program is run with, and the starting of
# one: see tcsapp. The same crate an app itself is written against, so that the
# protocol is stated once.
tcsapp = { path = "../tcsapp" }
# The checks tcsverify makes, asked of the configuration before anything is
# opened, so that what this refuses to start on is what tcsverify reports.
tcsverify = { path = "../tcsverify" }
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
nix = { version = "0.27", features = ["poll", "fs"] }
socket2 = "0.6.2"
tcslog = "0.3.1"
# For the visual window only: see the `visual` feature.
slint = { version = "1.18", optional = true }
tcsdiagram = { path = "../tcsdiagram", optional = true }

[build-dependencies]
# Compiles the visual window's markup, and only for a build that has it.
slint-build = { version = "1.18", optional = true }

# Which payload types this tcspecial contains, each named as a configuration
# writes the type. Every one by default, so that a workspace build and its
# tests are what they always were; a build for a vehicle names the types it
# flies, and a configuration with a node of another type is refused as it is
# loaded:
#
#   cargo build -p tcspecial --release --no-default-features \
#       --features serial,i2c
#
# The network type over UDP, TCP and Unix-domain sockets is in every build --
# the link to the ground is UDP -- and so is every node that reaches no
# interface. `raw` is the raw protocol of the network type. The words are
# tcslibgs::graph::built::OPTIONAL_TYPES, which a test holds these to; see
# "Which Node Types Are Built" in docs/design.rst.
[features]
default = [
    "device-file",
    "serial",
    "i2c",
    "spi",
    "can",
    "iio",
    "rpmsg",
    "gpio",
    "hdlc",
    "raw",
]
# The visual window, `tcspecial --visual`: the graph drawn as tcsgui draws it,
# each link lit as data crosses it. Not a default and never in a build that
# flies -- it brings a window toolkit into the flight software -- so a
# tcspecial without it says so when it is asked for one. See src/visual.
visual = ["dep:slint", "dep:slint-build", "dep:tcsdiagram"]
device-file = []
serial = []
i2c = []
spi = []
can = []
iio = []
rpmsg = []
gpio = []
hdlc = []
raw = []

[dev-dependencies]
tempfile = "3.27.0"
