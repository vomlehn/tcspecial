# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-physics.schema.json

# The physics of the fprime example's vehicle: the zone its thermometer
# reads and its heater warms. Named by fprime-sim.yaml.
description: The physics of the vehicle of fprime.ytcs

physics:
  - type heater:
      # A heater of twenty watts, which on the zone below is a kelvin a second.
      - component: heater
        power: "20 W"
        voltage: "28 V"

  - type thermal_zone:
      # The zone, starting at and settling to ten degrees, losing any
      # difference with a hundred second constant.
      - component: zone
        capacity: "20 J/K"
        environment: "283.15 K"
        time_constant: "100 s"

connections:
  - from: heater.heat
    to: zone.heat
