# A payload that is a program and is asked: it answers with a reading.
#
# A payload: what the vehicle carries this flight, and this one is a program
# the mission wrote rather than a device on a bus. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a trigger,
# a command -- arrives at moc-in, which is the shape every payload has. It is
# run with one file interface, on which it reads what asks and writes the
# answer, so the bytes that ask are the datum itself and there is no trigger to
# state. The interfaces and the packets they carry are tcsapp; its Rust is
# tcspecial/src/node/payload/app_all_pl/.
node: app_all_pl
type: app_all_pl
about: >
  A payload of its own making: a program that is asked for a reading and
  answers with one.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: executable
    required: true
    kind: path
    about: >
      Where the application is. It is started when the configuration is
      loaded, so one that cannot be executed is a fault found on the ground,
      and it is run with this node's name as its first argument. A leading `~`
      and `$HOME` are expanded as a shell would expand them, against the home
      directory of whatever runs the application: so the value is kept as
      written and what it stands for is settled aboard.
  - name: app-payload-arg
    required: true
    about: >
      What the program is told about the payload stream, as the argument after
      the node's name. Required: the arguments are a fixed list, so a node that
      said nothing would shift what the rest of the list means.
  - name: app-moc-arg
    required: true
    about: >
      What the program is told about the MOC stream, as the argument after the
      payload one where this kind has both. Required, for the reason the
      payload argument is.
  - name: restart
    required: false
    kind: boolean
    about: >
      Whether it is started again when it stops: true or false. A node that
      says nothing is a node left stopped, which is the answer a part of a
      control path wants.
