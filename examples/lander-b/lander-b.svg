<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="944" viewBox="0 0 1110 944" role="img" aria-labelledby="title desc">
  <title id="title">The lander example: lander-b, the Y axis</title>
  <desc id="desc">lander-b, one of the lander example's two tcspecials, flying the Y axis. Each payload at the left is a UDP socket tcs-sim simulates, joined to the lander or the joystick in tcs-sim's world; each reading is made a value by a to_value node and sent to the gateway, which takes it down through Yamcs. to_joystick_3_4_y also drives thruster_y, the dashed line, so the pilot's joystick is the thrust on the Y axis. ratings sends the lander's latest landing ratings straight to the gateway, as landed and crashed send their signals. The gateway passes what the ground sends it to restart, the dashed line from it, which restarts the lander.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .payload { fill: #eaf2fb; stroke: #2f6db5; stroke-width: 1.6; }
      .vehicle { fill: #f5f0fc; stroke: #7e57c2; stroke-width: 1.6; }
      .gateway { fill: #e9f6ee; stroke: #2e7d4f; stroke-width: 1.6; }
      .link { stroke: #374151; stroke-width: 1.6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
