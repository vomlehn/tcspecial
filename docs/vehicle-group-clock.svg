      .head { font-size: 15px; font-weight: bold; fill: #1f2937; }
      .label { font-size: 13px; fill: #1f2937; }
      .small { font-size: 12px; fill: #4b5563; }
      .row { stroke: #d1d5db; stroke-width: 1; }
      .clock { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 3 4; }
      .axis { stroke: #374151; stroke-width: 1.5; }
    </style>
  </defs>
