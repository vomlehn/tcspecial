# Discrete lines, driven, and reported to the ground.
#
# A payload: what the vehicle carries this flight. What arrives at moc-in --
# a thermostat's decision, a command from the ground, 1 or 0 -- is what its
# lines are driven to, and a value that changes them goes on by moc-out to
# whatever they drive, as a gpio_out's does. Every state_interval the last
# value they were told also goes out by world-out, towards the ground. Its
# Rust is tcspecial/src/node/payload/gpio/, which it shares with gpio_in and
# gpio_out.
node: gpio_inout
type: gpio_inout
about: >
  Discrete lines, driven, whose state the ground is told on an interval.
payload-sink: false
payload-source: true
gateway-sink: true
gateway-source: true
attributes:
  - name: path
    required: true
    kind: path
    about: >
      The GPIO chip the lines are on: /dev/gpiochip0.
  - name: lines
    required: true
    about: Which lines of that chip it drives, comma separated.
  - name: state_interval
    required: true
    kind: interval
    about: >
      How often to report the last value the lines were told, by
      world-out: 1 s.
  - name: init
    required: false
    kind: bytes
    about: >
      What to write to it as the vehicle opens it -- at startup, and whenever
      the ground starts it again -- written as a trigger is: a C string in
      quotes, bytes in brackets, or both one after another. A heater that must
      start off. A write that fails stops the node from starting.
  - name: sim_address
    required: false
    about: >
      Where tcssim answers for the lines over UDP when they are simulated, as
      a loopback address and port: 127.0.0.1:5204. Under --simulate=some or
      all tcspecial drives and watches the lines there instead of on the
      chip, so no dummy chip is needed; under --simulate=none, the flight
      setting, it is not used and the chip is opened.
