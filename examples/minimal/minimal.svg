<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">The minimal example</title>
  <desc id="desc">One payload, sensor, a UDP socket at 127.0.0.1:5001. tcspecial reads it and sends each reading to the ground over the payload's telemetry link, which the tcspecial section's payload_telemetry describes: from 0.0.0.0:6000 to 127.0.0.1:6100, the bases plus the sensor's device id, 0.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .payload { fill: #eaf2fb; stroke: #2f6db5; stroke-width: 1.6; }
      .socket { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .groundward { fill: none; stroke: #2563eb; stroke-width: 2; }
      .telemetry { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="45" y="44">PAYLOAD</text>
  <text class="heading" x="660" y="44">GROUND</text>

  <!-- tcspecial, the vehicle -->
  <rect class="boundary" x="280" y="58" width="320" height="200" rx="14"/>
  <text class="heading" x="298" y="84">TCSPECIAL (VEHICLE)</text>

  <!-- sensor -->
  <rect class="payload" x="45" y="118" width="190" height="80" rx="10"/>
  <text class="name" x="61" y="145">sensor</text>
  <text class="kind" x="61" y="166">network payload, UDP</text>
  <text class="detail" x="61" y="185">127.0.0.1:5001</text>

  <!-- sensor's telemetry link, aboard -->
  <rect class="socket" x="330" y="118" width="220" height="80" rx="10"/>
  <text class="name" x="346" y="145">sensor telemetry</text>
  <text class="kind" x="346" y="166">telemetry link, device id 0</text>
  <text class="detail" x="346" y="185">sends from 0.0.0.0:6000</text>

  <!-- the ground station -->
  <rect class="ground" x="660" y="118" width="215" height="80" rx="10"/>
  <text class="name" x="676" y="145">MOC</text>
  <text class="kind" x="676" y="166">ground station</text>
  <text class="detail" x="676" y="185">receives on 127.0.0.1:6100</text>

  <!-- Links -->
  <path class="groundward" d="M235,158 L326,158" marker-end="url(#arrow-blue)"/>
  <text class="label" x="249" y="148">reads</text>
  <path class="telemetry" d="M550,158 L656,158" marker-end="url(#arrow-blue)"/>
  <text class="label" x="560" y="148">readings</text>

  <text class="note" x="298" y="232">Not drawn in the configuration: it comes from</text>
  <text class="note" x="298" y="248">payload_telemetry, counted on by device id 0.</text>

  <!-- Legend -->
  <line x1="45" y1="300" x2="860" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <path class="groundward" d="M45,332 L95,332" marker-end="url(#arrow-blue)"/>
  <text class="label" x="105" y="336">data link, toward the ground</text>
  <path class="telemetry" d="M330,332 L380,332" marker-end="url(#arrow-blue)"/>
  <text class="label" x="390" y="336">telemetry link, from the tcspecial section</text>
  <rect class="payload" x="45" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="75" y="369">payload</text>
  <rect class="socket" x="160" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="190" y="369">opened by tcspecial</text>
  <rect class="ground" x="340" y="356" width="22" height="16" rx="4"/>
  <text class="label" x="370" y="369">ground program</text>
</svg>
