# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-physics.schema.json

# The physics of the descent example's vehicle: a lander over the Moon, and
# the engine that brakes it. Named by descent-sim.yaml.
#
# Two parts, each simulated alone and joined below: the engine is throttled
# and gives out a force and the fuel it burns; the body takes both, falls
# under gravity, loses the mass it burns, and touches down. Its fall is the
# rocket equation's, in closed form, and the moment it reaches the ground,
# which no closed form gives, is found ahead of time and met exactly.
description: The physics of the vehicle of descent.ytcs

physics:
  - type body:
      # A tonne and a half, five hundred metres up and falling at twenty metres
      # a second, in the Moon's gravity: the start of a terminal descent. At
      # full throttle the engine brakes it at not quite one and a half metres a
      # second a second, and holds it at a little over half.
      - component: lander
        altitude: "500 m"
        gravity: "1.62 m/s2"
        mass: "1500 kg"
        velocity: "-20 m/s"

  - type engine:
      # A throttleable engine of four and a half kilonewtons, the size of a
      # small lander's descent engine, with a hundred kilograms of fuel: a half
      # again what the descent burns, which is a margin and not much of one.
      - component: engine
        fuel: "100 kg"
        isp: "311 s"
        thrust: "4500 N"

connections:
  - from: engine.force
    to: lander.force
  - from: engine.flow
    to: lander.flow
