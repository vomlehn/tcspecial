# What rpmlint is to accept in the tcspecial, tcspecial-ground and
# tcspecial-test RPMs, read by `make lint-packages` and never shipped. Each
# filter is a finding that is intended, with why; anything else rpmlint
# reports is to be fixed.

# Debian's rpmlint, unlike Fedora's, comes with no list of licences it
# knows, and so calls every one invalid. rpmlint splits the SPDX expression
# "MIT OR Apache-2.0" into its two licences itself; these are the two.
ValidLicenses = ["MIT", "Apache-2.0"]

Filters = [
	# An add-on package lives under /opt/<package>, as FHS 3.0 section
	# 3.13 lays it out, and /opt/tcs is the tree every TCS package shares.
	' dir-or-file-in-opt ',
	# tcspecial-ground holds libtcs and what is built against it, tcs.h,
	# tcs.pc and the static library, by design: there is no -devel
	# package for them to go in. The Python packages and the editor's data
	# beside the library are not named for its version either.
	'^tcspecial-ground\.[^:]+: [EW]: non-versioned-file-in-library-package ',
	'^tcspecial-ground\.[^:]+: [EW]: devel-file-in-non-devel-package ',
	# With STRIP=1, the default, the static library is stripped of its
	# debugging information on purpose, keeping the symbols a link needs.
	' static-library-without-debuginfo /opt/tcs/lib/libtcs\.a$',
	# The library is linked with the GNU hash section alone, the modern
	# default, and not the old SysV one as well.
	' missing-hash-section /opt/tcs/lib/libtcs\.so\.',
	# Words of the trade that rpmlint's dictionary does not have.
	" spelling-error \\('(libtcs|config|pc|schemas)',",
	# The packages are not signed.
	' no-signature',
	# python-base is openSUSE's name; Fedora's python3 is depended on
	# through the python3 tcspecial-ground requires.
	' no-dependency-on python-base ',
	# tcsmoc starts the tcspecial installed beside it, so tcspecial-test
	# needs exactly the tcspecial built with it.
	'^tcspecial-test\.[^:]+: [EW]: requires-on-release tcspecial = ',
]
