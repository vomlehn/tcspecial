<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">The fprime example</title>
  <desc id="desc">The vehicle answers to an F´ flight computer rather than to the ground. The thermometer's readings go by its payload-out link to fsw, a gateway_fprime node, and so to the F´ deployment's TcsBridge component at 127.0.0.1:9702: fsw's bridge_base, 9700, plus the thermometer's device id, 2. The bridge gives each reading the F´ ID 0x3002: fsw's fprime_id_base, 0x3000, plus the same id. A command from the bridge goes up to fsw, which tcspecial binds at 127.0.0.1:9600, and leaves it by its gateway-out link for the heater.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .socket { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .up { fill: none; stroke: #b45309; stroke-width: 2; }
      .down { fill: none; stroke: #2563eb; stroke-width: 2; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="450" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="45" y="44">TCSPECIAL (PAYLOAD PROCESSOR)</text>
  <text class="heading" x="640" y="44">F´ FLIGHT COMPUTER</text>

  <rect class="boundary" x="30" y="58" width="560" height="262" rx="14"/>

  <!-- The heater, driven -->
  <rect class="socket" x="55" y="80" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="107">heater</text>
  <text class="kind" x="71" y="128">network payload, id 1</text>
  <text class="detail" x="71" y="147">udp 127.0.0.1:9001</text>

  <!-- The thermometer, read -->
  <rect class="socket" x="55" y="210" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="237">thermometer</text>
  <text class="kind" x="71" y="258">network payload, id 2</text>
  <text class="detail" x="71" y="277">udp 127.0.0.1:9002</text>

  <!-- The gateway node, the bridge's end of the link both ways -->
  <rect class="socket" x="340" y="110" width="220" height="160" rx="10"/>
  <text class="name" x="356" y="137">fsw</text>
  <text class="kind" x="356" y="158">gateway_fprime, id 0</text>
  <text class="detail" x="356" y="180">binds 127.0.0.1:9600</text>
  <text class="detail" x="356" y="198">bridge_base</text>
  <text class="detail" x="356" y="214">  127.0.0.1:9700</text>
  <text class="detail" x="356" y="232">fprime_id_base</text>
  <text class="detail" x="356" y="248">  0x3000</text>

  <!-- The F´ deployment's bridge component -->
  <rect class="ground" x="640" y="110" width="235" height="160" rx="10"/>
  <text class="name" x="656" y="137">TcsBridge</text>
  <text class="kind" x="656" y="158">F´ component, on tcslib-c</text>
  <text class="detail" x="656" y="186">channel 0x3002:</text>
  <text class="detail" x="656" y="204">  thermometer</text>
  <text class="note" x="656" y="236">to the ground by</text>
  <text class="note" x="656" y="252">the deployment's own link</text>

  <!-- Up: a command from the bridge, to fsw and on to the heater -->
  <path class="up" d="M636,140 L564,140" marker-end="url(#arrow-amber)"/>
  <text class="label" x="574" y="131">command</text>
  <path class="up" d="M340,130 L259,120" marker-end="url(#arrow-amber)"/>
  <text class="label" x="268" y="112">gateway-out</text>

  <!-- Down: a reading, to fsw and on to the bridge -->
  <path class="down" d="M255,250 L336,240" marker-end="url(#arrow-blue)"/>
  <text class="label" x="262" y="266">payload-out</text>
  <path class="down" d="M560,240 L636,240" marker-end="url(#arrow-blue)"/>
  <text class="label" x="566" y="228">reading</text>
  <text class="detail" x="566" y="258">:9702</text>

  <!-- Legend -->
  <line x1="45" y1="345" x2="860" y2="345" stroke="#e5e7eb" stroke-width="1"/>
  <path class="up" d="M45,377 L95,377" marker-end="url(#arrow-amber)"/>
  <text class="label" x="105" y="381">command, from the flight computer</text>
  <path class="down" d="M370,377 L420,377" marker-end="url(#arrow-blue)"/>
  <text class="label" x="430" y="381">reading, to the flight computer</text>
  <rect class="socket" x="45" y="401" width="22" height="16" rx="4"/>
  <text class="label" x="75" y="414">opened by tcspecial</text>
  <rect class="ground" x="260" y="401" width="22" height="16" rx="4"/>
  <text class="label" x="290" y="414">the F´ deployment</text>
</svg>
