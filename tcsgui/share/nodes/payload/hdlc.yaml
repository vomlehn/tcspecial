# A synchronous line, framed: a radio or a bus bridge.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/hdlc/.
node: hdlc
type: hdlc
about: >
  A synchronous line, framed: a radio or a bus bridge.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: interface
    required: true
    about: >
      The network interface the line appears as: hdlc0.
  - name: standard
    required: true
    about: Which framing the line uses, there being no negotiation on one.
  - name: clock_type
    required: true
    about: >
      Which end generates the clock: this one, the far one, or neither.
  - name: clock_rate
    required: false
    kind: whole
    about: >
      The clock rate, which is required only where this end generates it.
  - name: encoding
    required: false
    about: How the bits are encoded on the line.
  - name: frame_check
    required: false
    about: Which frame check sequence the frames carry.
  - name: loopback
    required: false
    kind: boolean
    about: >
      Whether the interface is put in loopback, for a bench test with
      nothing on the far end.
  - name: group
    required: false
    about: The payload group that reads it, where it is in one.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer, as hex bytes. A payload with none
      is one the configuration describes as only read.
