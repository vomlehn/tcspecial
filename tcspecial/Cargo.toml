[package]
name = "tcspecial"
version = "0.1.0"
edition = "2021"
license.workspace = true
# The repository's README, which is the crate's page on crates.io.
readme = "../README.md"
description = "TCSpecial flight software: the spacecraft's command interpreter and data handler manager, being integrated with NASA's cFS and JPL's F Prime"

[dependencies]
tcslibgs = { path = "../tcslibgs" }
# The file interfaces an app node's program is run with, and the starting of
# one: see tcsapp. The same crate an app itself is written against, so that the
# protocol is stated once.
tcsapp = { path = "../tcsapp" }
# The checks tcsverify makes, asked of the configuration before anything is
# opened, so that what this refuses to start on is what tcsverify reports.
tcsverify = { path = "../tcsverify" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
nix = { version = "0.27", features = ["poll", "fs"] }
socket2 = "0.6.2"
tcslog = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"
