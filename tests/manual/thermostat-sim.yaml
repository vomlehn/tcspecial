# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of thermostat.ytcs, the manual's
# fixture: the thermostat example as it would be aboard, its sensors on I2C
# and SPI and its heaters on GPIO. The example itself puts each on a UDP
# socket instead, so that it runs on any desk; see
# examples/thermostat/thermostat-sim.yaml. Run on a desk, these payloads
# want the kernel's stand-ins at their paths: see bin/mk-kernel-stand-ins.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated.
#
# The three sensors report a thermal mass rather than noise, which is what
# makes the vehicle's half of the loop watchable: three readings of one
# temperature agree, so the vote produces a temperature and the thermostat
# decides on it.
#
# The heaters are discrete lines on the kernel's gpio-sim, which the vehicle
# drives and tcssim watches: each time the vehicle switches them, their panel
# counts it, and the mass is warmed through the input each is on. So the loop
# closes through tcspecial: the sensors report the mass, the vehicle decides,
# and the heaters warm it.
#
# To close it in tcssim alone, with no tcspecial running, add
# "thermostat: thermostat" to the tcssim section below: tcssim then stands in
# for the hysteresis node of that name, with its setpoint and band. Never
# with tcspecial running, whose own thermostat switches the same heaters.
description: Simulator settings for the payloads of thermostat.ytcs

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7907"

# The physics model the payloads below attach to: the thermostat example's,
# this being the same vehicle with its payloads on buses, so that the zone
# is stated once for both.
physics: ../../examples/thermostat/thermostat-physics.yaml

simulated_payload_groups:
  # The three sensors are read together, every tenth of a second, as their
  # payload group in thermostat.ytcs says. Each reports the mass, in the
  # encoding the to_kelvin node its readings go to expects: this file says
  # nothing about the format, the scale or the offset, because a scale written
  # in two files is a scale that can disagree with itself.
  - name: zone_temps
    simulate: true
    packet_interval: 100 ms
    reads: basic

simulated_payloads:
  # Each sensor on an output of its own.
  - name: temp_1
    type: i2c
    group: zone_temps
    output: out1

  - name: temp_2
    type: i2c
    group: zone_temps
    output: out2

  - name: temp_3
    type: spi
    group: zone_temps
    output: out3

  # Driven and never read: their stand-ins send nothing, count each time the
  # vehicle moves their lines, and warm the mass while on.
  - name: heaters_1
    simulate: true
    type: gpio
    heats: basic
    input: in1
    rate: "3.0"

  - name: heaters_2
    simulate: true
    type: gpio
    heats: basic
    input: in2
    rate: "3.0"
