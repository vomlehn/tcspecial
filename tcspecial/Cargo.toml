[package]
name = "tcspecial"
version = "0.1.0"
edition = "2021"
license.workspace = true
# The repository's README, which is the crate's page on crates.io.
readme = "../README.md"
description = """\
TCSpecial flight software: the spacecraft's command interpreter and data \
handler manager, being integrated with NASA's cFS and JPL's F Prime"""

[dependencies]
tcsprotocol = { path = "../tcsprotocol" }
tcsos = { path = "../tcsos" }
# The file interfaces an app node's program is run with, and the starting of
# one: see tcsapp. The same crate an app itself is written against, so that the
# protocol is stated once.
tcsapp = { path = "../tcsapp" }
# The checks tcs-verify makes, asked of the configuration before anything is
# opened, so that what this refuses to start on is what tcs-verify reports.
tcsverify = { path = "../tcsverify" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
tcslog = "0.3.1"
# For the visual window only: see the `visual` feature.
slint = { version = "1.18", optional = true }
tcs-diagram = { path = "../tcs-diagram", optional = true }
# A seed for the bit errors drawn from the system's source of randomness,
# where the simulator file says `seed: random`: only with bit-errors.
getrandom = { version = "0.3", optional = true }

[build-dependencies]
# Compiles the visual window's markup, and only for a build that has it.
slint-build = { version = "1.18", optional = true }

# Which payload types this tcspecial contains, each named as a configuration
# writes the type. Every one by default, so that a workspace build and its
# tests are what they always were; a build for a vehicle names the types it
# flies, and a configuration with a node of another type is refused as it is
# loaded:
#
#   cargo build -p tcspecial --release --no-default-features \
#       --features serial,i2c
#
# The network type over UDP, TCP and Unix-domain sockets is in every build --
# the link to the ground is UDP -- and so is every node that reaches no
# interface. `raw` is the raw protocol of the network type. The words are
# tcsprotocol::graph::built::OPTIONAL_TYPES, which a test holds these to;
# see "Which Node Types Are Built" in docs/tcspecial-design.rst.
# Socket options std does not have, for the raw endpoint and the address
# tables: Linux alone.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6.2", features = ["all"] }

[features]
default = [
    "device-file",
    "serial",
    "i2c",
    "spi",
    "i2c_tmass",
    "spi_tmass",
    "can",
    "iio",
    "rpmsg",
    "gpio_in",
    "gpio_out",
    "gpio_inout",
    "hdlc",
    "raw",
]
# The visual window, `tcspecial --visual`: the graph drawn as tcs-cfge draws it,
# each link lit as data crosses it. Not a default and never in a build that
# flies -- it brings a window toolkit into the flight software -- so a
# tcspecial without it says so when it is asked for one. See src/visual.
visual = ["dep:slint", "dep:slint-build", "dep:tcs-diagram"]
# Bit errors on the link to the ground, asked for by the simulator file's
# `gateway` section: every packet up or down is dropped as a bit error would
# drop it, for testing a ground station against a lossy link. Test code: not
# a default and never in a build that flies, refused under --simulate=none
# even where it is built, and a tcspecial without it refuses a simulator
# file that asks for it. A build with it says
# `test` in every beacon. See src/runtime/bit_errors.rs.
bit-errors = ["dep:getrandom"]
device-file = []
serial = []
i2c = []
spi = []
# A temperature sensor on a thermal mass is a device on its bus, opened as
# that bus's devices are, so it brings the bus with it.
i2c_tmass = ["i2c"]
spi_tmass = ["spi"]
can = []
iio = []
rpmsg = []
# The three kinds of a set of discrete lines, which share one module: a
# build with any of them has it.
gpio_in = []
gpio_out = []
gpio_inout = []
hdlc = []
raw = []

[dev-dependencies]
tempfile = "3.27.0"
# The ground's end of a cFS software bus, which tests/cfs_ground.rs commands
# the vehicle through: only the tests are built with it, never the flight
# program.
tcsmoc = { path = "../tcsmoc" }

[lints]
workspace = true
