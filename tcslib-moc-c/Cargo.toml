[package]
name = "tcslib-moc-c"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
The TCSpecial MOC Correspondent (tcslib-moc) for C and C++: a ground \
station's beacons, the vehicle's data from a gateway node, and commands to \
the vehicle, behind one header"""

[lib]
# libtcs_moc_c.a and libtcs_moc_c.so, which a C or C++ program links with
# include/tcslib-moc-c.h; and the rlib, for this crate's own tests.
name = "tcs_moc_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tcslib-moc = { path = "../tcslib-moc" }
tcslib-protocol = { path = "../tcslib-protocol" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
