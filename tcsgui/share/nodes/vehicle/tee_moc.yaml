# A vehicle node that takes what the ground sends and sends each datum on both
# ways: as MOC data by its moc-out, and again as payload data by its
# payload-out.
#
# A link cannot carry one stream into the other, so this is how what the
# ground sends reaches a payload-in. Its Rust is tcspecial/src/node/vehicle/tee_moc/.
node: tee-moc
type: tee-moc
about: Sends what the ground sends on as MOC data and again as payload data.
moc-sink: true
moc-source: true
payload-source: true
