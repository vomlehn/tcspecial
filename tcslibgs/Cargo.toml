[package]
name = "tcslibgs"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
What TCSpecial's ground and vehicle software share: the command and telemetry \
protocol, and how every configuration file is read and checked"""

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
serde_norway = "0.9.42"
quick-xml = { version = "0.42", features = ["serialize"] }
md5 = "0.8"
# Packs and unpacks the commands and answers, from the code tcs-xtce generated
# from xtce/link.xml. The version is the one the tcs-xtce checkout beside
# this tree, whose generator wrote that code, must be at, as the code calls
# this runtime: see the tcs-xtce target in Makefile.
tcs-xtce = "=0.4.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
