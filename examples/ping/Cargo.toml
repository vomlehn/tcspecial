[package]
name = "ping_example"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
The tests of the ping example, whose ground station is Python 3: they hold the \
Python to the Rust it is written after"""

# Nothing is built for the example itself: its ground station is ping_gateway.py
# beside this. What is here is the tests, which need the Rust to hold the
# Python to -- the configuration's facts, the ping format and the beacon's
# layout.
[dev-dependencies]
tcsprotocol = { path = "../../tcsprotocol" }
tempfile = "3"
# Ports for the programs the tests start, never the same twice: see
# tcs-testing.
tcs-testing = { path = "../../tcs-testing" }

[lints]
workspace = true
