[package]
name = "tcs-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
Window pieces shared by the TCSpecial ground programs: the panels, and what to \
show on them"""

[dependencies]
# What a panel reports is `tcsmoc::beacon`'s: this crate is how it is shown,
# not what it means.
tcsmoc = { path = "../tcsmoc" }
# For Color alone, which is what a stage of staleness is turned into here.
slint = "1.3"

[lints]
workspace = true
