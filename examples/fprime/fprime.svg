<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655" role="img" aria-labelledby="title desc">
  <title id="title">The fprime example</title>
  <desc id="desc">The vehicle answers to an F´ flight computer rather than to the ground. The thermometer's readings go by its payload-out links to fsw, a gateway_fprime node, and to cabin_temp, a to_kelvin compute node that makes each reading a temperature and sends it on to fsw too, and to heater_wanted, a hysteresis compute node that decides whether the heater is wanted, on below 283.65 K and off above 284.65 K, and sends each change of decision to fsw. fsw sends each to the F´ deployment's TcsBridge component at its bridge_base, 9700, plus the sender's device id: the thermometer's, 2, at 127.0.0.1:9702, cabin_temp's, 3, at 127.0.0.1:9703, and heater_wanted's, 4, at 127.0.0.1:9704. The bridge gives each the F´ ID fprime_id_base, 0x3000, plus the same id: the thermometer's bytes are channel 0x3002, cabin_temp's temperature, in kelvin, channel 0x3003, and heater_wanted's decision, true for on, channel 0x3004. heater_wanted is advice and drives nothing. A command from the bridge, 1 or 0, goes up to fsw, which tcspecial binds at 127.0.0.1:9600, and leaves it by its gateway-out link for the heater.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #111827; }
      .name { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .kind { font-size: 12.5px; fill: #374151; }
      .detail { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4b5563; }
      .heading { font-size: 13px; font-weight: bold; fill: #475569; letter-spacing: 0.06em; }
      .label { font-size: 12px; fill: #1f2937; }
      .note { font-size: 12px; fill: #4b5563; }
      .socket { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .compute { fill: #ffffff; stroke: #2f6db5; stroke-width: 1.4; }
      .ground { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
      .boundary { fill: #fbfbfd; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .up { fill: none; stroke: #b45309; stroke-width: 2; }
      .down { fill: none; stroke: #2563eb; stroke-width: 2; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="655" fill="#ffffff"/>

  <!-- Column headings -->
  <text class="heading" x="45" y="44">TCSPECIAL (PAYLOAD PROCESSOR)</text>
  <text class="heading" x="640" y="44">F´ FLIGHT COMPUTER</text>

  <rect class="boundary" x="30" y="58" width="560" height="467" rx="14"/>

  <!-- The heater, driven -->
  <rect class="socket" x="55" y="80" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="107">heater</text>
  <text class="kind" x="71" y="128">network payload, id 1</text>
  <text class="detail" x="71" y="147">udp 127.0.0.1:9001</text>

  <!-- The thermometer, read -->
  <rect class="socket" x="55" y="200" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="227">thermometer</text>
  <text class="kind" x="71" y="248">network payload, id 2</text>
  <text class="detail" x="71" y="267">udp 127.0.0.1:9002</text>

  <!-- The conversion, which makes a reading a temperature -->
  <rect class="compute" x="55" y="315" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="342">cabin_temp</text>
  <text class="kind" x="71" y="363">compute, to_kelvin, id 3</text>
  <text class="detail" x="71" y="382">i16_be counts to kelvin</text>

  <!-- The thermostat, whose decisions are advice and drive nothing -->
  <rect class="compute" x="55" y="430" width="200" height="80" rx="10"/>
  <text class="name" x="71" y="457">heater_wanted</text>
  <text class="kind" x="71" y="478">compute, hysteresis, id 4</text>
  <text class="detail" x="71" y="497">on 283.65, off 284.65 K</text>

  <!-- The gateway node, the bridge's end of the link both ways -->
  <rect class="socket" x="340" y="110" width="220" height="190" rx="10"/>
  <text class="name" x="356" y="137">fsw</text>
  <text class="kind" x="356" y="158">gateway_fprime, id 0</text>
  <text class="detail" x="356" y="180">binds 127.0.0.1:9600</text>
  <text class="detail" x="356" y="198">bridge_base</text>
  <text class="detail" x="356" y="214">  127.0.0.1:9700</text>
  <text class="detail" x="356" y="232">fprime_id_base</text>
  <text class="detail" x="356" y="248">  0x3000</text>

  <!-- The F´ deployment's bridge component -->
  <rect class="ground" x="640" y="110" width="235" height="235" rx="10"/>
  <text class="name" x="656" y="137">TcsBridge</text>
  <text class="kind" x="656" y="158">F´ component, on tcslib-c</text>
  <text class="detail" x="656" y="182">channel 0x3002:</text>
  <text class="detail" x="656" y="198">  thermometer, bytes</text>
  <text class="detail" x="656" y="218">channel 0x3003:</text>
  <text class="detail" x="656" y="234">  cabin_temp, kelvin</text>
  <text class="detail" x="656" y="254">channel 0x3004:</text>
  <text class="detail" x="656" y="270">  heater_wanted, bool</text>
  <text class="note" x="656" y="310">to the ground by</text>
  <text class="note" x="656" y="326">the deployment's own link</text>

  <!-- Up: a command from the bridge, to fsw and on to the heater -->
  <path class="up" d="M636,140 L564,140" marker-end="url(#arrow-amber)"/>
  <text class="label" x="574" y="131">1 or 0</text>
  <path class="up" d="M340,130 L259,120" marker-end="url(#arrow-amber)"/>
  <text class="label" x="268" y="112">gateway-out</text>

  <!-- Down: a reading, to fsw and to cabin_temp, and the temperature to
       fsw, and both on to the bridge -->
  <path class="down" d="M255,240 L336,232" marker-end="url(#arrow-blue)"/>
  <text class="label" x="262" y="226">payload-out</text>
  <path class="down" d="M155,280 L155,311" marker-end="url(#arrow-blue)"/>
  <text class="label" x="163" y="301">payload-out</text>
  <path class="down" d="M255,355 L380,355 L380,304" marker-end="url(#arrow-blue)"/>
  <text class="label" x="262" y="347">payload-out</text>
  <path class="down" d="M560,195 L636,195" marker-end="url(#arrow-blue)"/>
  <text class="label" x="566" y="187">reading</text>
  <text class="detail" x="566" y="209">:9702</text>
  <path class="down" d="M560,240 L636,240" marker-end="url(#arrow-blue)"/>
  <text class="label" x="566" y="232">kelvin</text>
  <text class="detail" x="566" y="254">:9703</text>
  <path class="down" d="M560,285 L636,285" marker-end="url(#arrow-blue)"/>
  <text class="label" x="566" y="277">on/off</text>
  <text class="detail" x="566" y="301">:9704</text>

  <!-- Down: the temperature to heater_wanted, and its decisions to fsw -->
  <path class="down" d="M155,395 L155,426" marker-end="url(#arrow-blue)"/>
  <text class="label" x="163" y="416">payload-out</text>
  <path class="down" d="M255,470 L470,470 L470,304" marker-end="url(#arrow-blue)"/>
  <text class="label" x="262" y="462">payload-out</text>

  <!-- Legend -->
  <line x1="45" y1="550" x2="860" y2="550" stroke="#e5e7eb" stroke-width="1"/>
  <path class="up" d="M45,582 L95,582" marker-end="url(#arrow-amber)"/>
  <text class="label" x="105" y="586">command, from the flight computer</text>
  <path class="down" d="M370,582 L420,582" marker-end="url(#arrow-blue)"/>
  <text class="label" x="430" y="586">reading, to the flight computer</text>
  <rect class="socket" x="45" y="606" width="22" height="16" rx="4"/>
  <text class="label" x="75" y="619">opened by tcspecial</text>
  <rect class="compute" x="260" y="606" width="22" height="16" rx="4"/>
  <text class="label" x="290" y="619">computed aboard</text>
  <rect class="ground" x="450" y="606" width="22" height="16" rx="4"/>
  <text class="label" x="480" y="619">the F´ deployment</text>
</svg>
