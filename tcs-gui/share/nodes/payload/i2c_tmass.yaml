# A temperature sensor on an I2C bus, fixed to a thermal mass.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# world-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Reached as an i2c device is, and
# a type of its own for what it is and for sim_address. Its Rust is
# tcspecial/src/node/payload/i2c_tmass/, which opens it as
# tcspecial/src/node/payload/i2c/ does.
node: i2c_tmass
type: i2c_tmass
about: A temperature sensor on an I2C bus, fixed to a thermal mass.
payload-sink: false
payload-source: true
gateway-sink: true
gateway-source: false
attributes:
  - name: path
    required: true
    kind: path
    about: >
      The I2C bus it is reached through: /dev/i2c-1.
  - name: address
    required: true
    about: >
      Its address on that bus, as hex: 0x48.
  - name: group
    required: false
    about: >
      The payload group that reads it, where it is in one. Optional, though a
      payload that states a trigger needs one: the interval of its group is
      how often it is asked.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer: "READ\r", [55], or parts of both one
      after another, "AT" [0D 0A]. A payload with none is one the
      configuration describes as only read.
  - name: trigger_interval
    required: false
    kind: interval
    about: >
      How often the trigger goes out, which is how often this payload is
      asked: 500 ms, 3 s. Said by a payload that has a trigger and is in no
      group; a payload in one is asked when its group is read.
  - name: read_delay
    required: false
    kind: interval
    about: >
      How long to wait between asking and reading, which is what the part
      takes to answer: 2 ms, 200 us. With one, a pass asks, waits and reads
      the answer to the question it asked; with none, a pass reads what the
      last ask produced and asks again. Only beside a trigger.
  - name: poll_interval
    required: false
    kind: interval
    about: >
      The least time between one read of it and the next, for a payload
      nothing asks: 1 s, 500 ms. A floor rather than a rate -- nothing says
      how soon there will be anything to read -- said by a payload with no
      trigger that is in no group, and never beside a trigger.
  - name: read_size
    required: false
    kind: whole
    about: How many bytes a reading is, at most.
  - name: ten_bit
    required: false
    kind: boolean
    about: Whether the address is a ten-bit one.
  - name: pec
    required: false
    kind: boolean
    about: Whether packet error checking is asked of the transfer.
  - name: retries
    required: false
    kind: whole
    about: How many times a failed transfer is tried again.
  - name: timeout
    required: false
    kind: timeout
    about: >
      How long a transfer is given before it is a failure, in milliseconds.
  - name: init
    required: false
    kind: bytes
    about: >
      What to write to it as the vehicle opens it -- at startup, and whenever
      the ground starts it again -- written as a trigger is: a C string in
      quotes, bytes in brackets, or both one after another. A heater that must
      start off, a register to set before the part reads sensibly. A write that
      fails stops the node from starting.
  - name: sim_address
    required: false
    about: >
      Where the sensor is reached over UDP when it is simulated, as a
      loopback address and port: 127.0.0.1:7950. Under --simulate=some or
      all tcspecial sends to and reads from that address instead of the
      device, and tcs-sim answers there with the temperature of the thermal
      mass the simulator file joins it to; under --simulate=none, the flight
      setting, it is not used and the device is opened.
  - name: world-out-type
    required: false
    about: >
      The type it sends: a whole number such as i16 or u32, a structure
      of them (x: i16, y: i16), or bytes, which is what it sends where
      unstated.
  - name: moc-in-type
    required: false
    about: >
      The type it is driven with: u8, a value such as ratio, or bytes,
      which is what it takes where unstated.
  - name: format
    required: false
    about: >
      How its part lays out the number it sends, where that is not the
      type's own layout: i16_le, or u24_be for a u32.
