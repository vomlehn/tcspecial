[package]
name = "beacon_example"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
The ground end of the beacon example: a window holding the beacon panel and \
nothing else"""
build = "build.rs"

[dependencies]
# Listening for beacons, which is the half of it that is not a window.
tcslib-moc = { path = "../../tcslib-moc" }
# Reading the configuration to find where the beacons are.
tcslib-protocol = { path = "../../tcslib-protocol" }
# The panel, and what to show on it.
tcslib-ui = { path = "../../tcslib-ui" }
slint = "1.3"
# The vehicle the window starts is told to die with it, which is a prctl.
libc = "0.2"

[dev-dependencies]
# Opens the window headlessly, so that a test can read what is on it. The
# same backend tcs-moc's window tests use.
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.3"

[lints]
workspace = true
