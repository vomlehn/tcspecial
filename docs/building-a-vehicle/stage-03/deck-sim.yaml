# yaml-language-server: $schema=../../../tcslibgs/schema/tcspecial-sim.schema.json

# How tcssim simulates the payloads of deck.ytcs. The two files are joined
# by name, and nothing here names a payload that file does not have.

description: Simulator settings for stage 3 of Building a Vehicle

# Where tcssim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no
# example and no other stage uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7922"

# The physics of the deck: the regolith around the thermometer's probe.
# The surroundings are the lunar ground's, twenty degrees below freezing.
world:
  ambient_temp: "253.15 K"

  physics:
    components:
      - type thermal_mass:
          # The regolith the probe sits in, starting at its surroundings'
          # temperature.
          - component: regolith
            capacity: "20 J/K"
            start: "253.15 K"
            time_constant: "50 s"

simulated_payloads:
  - type network:
      # A reading a second. There is no ground motion in tcssim's physics,
      # so what it sends is bytes of its own making, as for examples/minimal.
      - payload: seismometer
        packet_interval: 1 s
        protocol: udp
        simulate: true

  - type serial:
      # Asked, and answering: a triggered payload has no rate of its own here.
      # It reports the regolith's temperature, in the encoding
      # regolith_kelvin reads back, to a quarter of a kelvin, with a little
      # noise on each reading.
      - payload: regolith_thermometer
        accuracy: 0.25 K
        connects: regolith.temperature
        noise: 0.02 K
        simulate: true
