# yaml-language-server: $schema=../../tcsprotocol/schema/tcspecial-sim.schema.json

# How tcs-sim simulates the payloads of tees.ytcs.
description: Simulator settings for the payloads of tees.ytcs

# Where tcs-sim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcs-sim:
  ready: "127.0.0.1:7906"

simulated_payloads:
  - type network:
      # Driven and never read: tcs-sim sends nothing and counts what the
      # vehicle sends it, so that its panel shows each command reaching it.
      - payload: heater
        protocol: udp
        simulate: true
      # One reading a second, sent whole.
      - payload: sensor
        packet_interval: 1 s
        protocol: udp
        simulate: true
      - payload: spare
        packet_interval: 1 s
        protocol: udp
        simulate: true
