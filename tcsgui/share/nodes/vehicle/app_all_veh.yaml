# A program of the vehicle's own that carries both streams.
#
# Run with both file interfaces, which makes it the one kind of app that can
# carry a stream through: payload data read on the one interface can be written
# as payload data on the other, and MOC data likewise the other way about. So
# it is what a null node is when somebody wants something done to what passes
# -- and it has all four terminals, as a null node does. The interfaces and the
# packets they carry are tcsapp; its Rust is
# tcspecial/src/node/vehicle/app_all_veh/.
node: app_all_veh
type: app_all_veh
about: >
  A program of its own, on both interfaces: it reads and writes both streams.
payload-sink: true
payload-source: true
moc-sink: true
moc-source: true
attributes:
  - name: program
    required: true
    kind: path
    about: >
      Where the application is. It is started when the configuration is
      loaded, so one that cannot be executed is a fault found on the ground,
      and it is run with this node's name as its first argument. A leading `~`
      and `$HOME` are expanded as a shell would expand them, against the home
      directory of whatever runs the application: so the value is kept as
      written and what it stands for is settled aboard.
  - name: app-payload-arg
    required: true
    about: >
      What the program is told about the payload stream, as the argument after
      the node's name. Required: the arguments are a fixed list, so a node that
      said nothing would shift what the rest of the list means.
  - name: app-moc-arg
    required: true
    about: >
      What the program is told about the MOC stream, as the argument after the
      payload one where this kind has both. Required, for the reason the
      payload argument is.
  - name: restart
    required: false
    kind: boolean
    about: >
      Whether it is started again when it stops: true or false. A node that
      says nothing is a node left stopped, which is the answer a part of a
      control path wants.
