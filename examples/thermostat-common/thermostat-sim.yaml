# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

description: Simulator settings for the payloads of thermostat.ytcs and
  thermostat-yamcs.ytcs

tcssim:
  ready: 127.0.0.1:7907

world:
  ambient_temp: "288.15 K"

  physics:
    components:
      - type thermal_mass:
          - component: zone
            capacity: "20 J/K"
            heater_1_power: "4 W"
            heater_2_power: "4 W"
            period: "90 min"
            start: "292.15 K"
            swing: "0.5 K"
            time_constant: "50 s"
            wander: "0.25 K"
            wander_time: "10 min"

simulated_payload_groups:
  - group: zone_temps
    connects: zone.temperature
    drift: 0.05 K
    drift_time: 30 min
    packet_interval: 1 s
    simulate: true

simulated_payloads:
  - type gpio_inout:
      - payload: gpio-out-tmass1
        connects: zone.heater_1
        simulate: true

      - payload: gpio-out-tmass2
        connects: zone.heater_2
        simulate: true

  - type i2c:
      - payload: temp_1
        accuracy: 0.5 K
        group: zone_temps
        lag: 4 s
        noise: 0.03 K

      - payload: temp_2
        accuracy: 0.5 K
        group: zone_temps
        lag: 4 s
        noise: 0.03 K
        offset: +0.2 K

  - type spi:
      - payload: temp_3
        accuracy: 0.25 K
        group: zone_temps
        lag: 6 s
        noise: 0.02 K
        offset: -0.3 K

tcsgui:
  nodes:
    - { node: zone, x: -94, y: 185 }
  pages:
    thermostat-common: [zone]
