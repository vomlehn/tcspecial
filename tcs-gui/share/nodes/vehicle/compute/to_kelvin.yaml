# A sensor's raw bytes, scaled and offset into kelvin.
node: to_kelvin
type: compute
about: Reads a sensor's bytes as a number and scales it into kelvin.
sets:
  function: to_kelvin
payload-sink: true
payload-source: true
gateway-sink: true
gateway-source: true
attributes:
  - name: type-in
    required: true
    about: >
      The whole number its sensor sends: u8, i8, u16, i16, u32 or i32.
  - name: scale
    required: true
    about: >
      What one count is worth. Nought would make every reading the same.
  - name: offset
    required: true
    about: What is added after scaling.
