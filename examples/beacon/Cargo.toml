[package]
name = "beacon_example"
version = "0.1.0"
edition = "2021"
description = "The ground end of the beacon example: a window holding the beacon panel and nothing else"
build = "build.rs"

[dependencies]
# Listening for beacons, which is the half of it that is not a window.
tcslib = { path = "../../tcslib" }
# Reading the configuration to find where the beacons are.
tcslibgs = { path = "../../tcslibgs" }
# The panel, and what to show on it.
tcsui = { path = "../../tcsui" }
slint = "1.3"

[dev-dependencies]
# The test sends a beacon of its own, which is the one tcslibgs serialises.
serde_json = "1.0"
# Opens the window headlessly, so that a test can read what is on it. The
# same backend tcsmoc's window tests use.
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.3"
