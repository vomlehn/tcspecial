# yaml-language-server: $schema=../../tcsgui/share/schema/tcspecial-sim.schema.json

# How tcssim stands in for the payloads of fprime.ytcs.
#
# The thermometer reads the zone and the heater warms it, so what the
# flight computer sends the heater shows in the temperature it reads back:
# the bridge's test drives the heater on from F´ and watches zone_temp's
# channel climb.
description: Simulator settings for the payloads of fprime.ytcs

# Where tcssim answers whether it has made its stand-ins, which whatever
# starts the run asks before it starts tcspecial. A port no other example
# uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7902"

# The physics model the payloads below are joined to -- the zone they read
# and the heater that warms it -- which is the vehicle's, not this file's:
# see the file it names.
physics: fprime-physics.yaml

simulated_payloads:
  # Driven and never read: its stand-in sends nothing, counts what the
  # vehicle sends it, and switches the heater, which while it is on warms
  # the zone by a kelvin a second.
  - name: heater
    simulate: true
    type: network
    protocol: udp
    connects: heater.on

  # One reading a second of the zone, in the encoding zone_temp reads:
  # this file says nothing of the format, which is the conversion's.
  - name: thermometer
    simulate: true
    type: network
    protocol: udp
    packet_interval: 1 s
    connects: zone.temperature
