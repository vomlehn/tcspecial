# The payloads tcsmoc controls and tcssim simulates.
#
# This file describes the payloads themselves: which data handlers exist, how
# tcspecial reaches each one, and how big its packets are. It deliberately says
# nothing about how fast a simulated payload produces them or how the simulator
# divides a packet into segments; those are properties of the simulation rather
# than of the payload, and live in tcspecial1sim.yaml.
#
# A data handler takes its attributes from the group it names, and may then
# override any of them for itself.
#
# Where a payload exchanges data with the ground is not written on the payload.
# Each one has a UDP interface of its own, and its port is a base plus the
# payload's own id -- the position it has in this file -- so the two bases in
# the tcspecial section below say where all of them are. Four payloads were
# four chances to repeat a port, and a repeated port is two payloads whose
# data arrives interleaved.
version: "1.0"
description: TCSpecial payload set 1

# What tcspecial itself is configured with for this payload set -- the same
# section a tcspecial.yaml holds. First, because it is about the set as a
# whole rather than about any payload in it.
#
# Where the set's beacons go is read from here, that being the set's own
# business; the rest is carried and checked and not yet read, tcspecial taking
# it from the file TCSPECIAL_CONFIG_PATH names.
#
# Two command links, because what the ground needs in a hurry must never be
# queued behind what it asked for at leisure: a command about the spacecraft --
# ping it, arm it, restart it -- is taken on the command interface, and one
# about a payload -- start it, stop it, ask it for its statistics -- on
# payload_port at the same address.
#
# The protocol is not stated and cannot be: the link between tcspecial and the
# ground is UDP.
tcspecial:
  tcspecial_command: 0.0.0.0:4000
  moc_command: 127.0.0.1:4100
  payload_port: 4001
  tcspecial_tc_base: 0.0.0.0:6000
  moc_tc_base: 127.0.0.1:6100
  beacon_interval_ms: 5000
  beacon_address: "239.255.0.1:5550"
  beacon_interface: "127.0.0.1"
  log_dir: /var/log/tcspecial
  log_segment_bytes: 65536

payload_groups:
  # udp-steady and udp-fast are reached the same way: a UDP socket on this
  # host. What tells them apart is their port and packet size, so those stay
  # with the handlers and everything they share is here.
  - name: udp_localhost
    type: network
    protocol: udp
    address: localhost

payloads:
  - name: tcp-stream
    type: network
    protocol: tcp
    address: localhost
    port: 5000
    packet_size: 12

  - name: udp-steady
    group: udp_localhost
    port: 5001
    packet_size: 11

  - name: random-device
    type: device-file
    path: /dev/urandom
    packet_size: 1

  - name: udp-fast
    group: udp_localhost
    port: 5003
    packet_size: 15
