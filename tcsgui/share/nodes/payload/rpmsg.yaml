# Software on another core aboard, over an rpmsg channel.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/rpmsg/.
node: rpmsg
type: rpmsg
about: Software on another core aboard, over an rpmsg channel.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: path
    required: true
    kind: path
    about: The rpmsg endpoint it is reached through.
  - name: service
    required: true
    about: The service name the far core announces.
  - name: group
    required: false
    about: The payload group that reads it, where it is in one.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer, as hex bytes. A payload with none
      is one the configuration describes as only read.
