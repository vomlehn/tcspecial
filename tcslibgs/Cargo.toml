[package]
name = "tcslibgs"
version = "0.1.0"
edition = "2021"
description = "What TCSpecial's ground and vehicle software share: the command and telemetry protocol, and how every configuration file is read and checked"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
serde_norway = "0.9.42"
quick-xml = { version = "0.42", features = ["serialize"] }
md5 = "0.8"

[dev-dependencies]
tempfile = "3"
