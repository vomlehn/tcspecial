# A vehicle node that carries both streams through and does nothing to what
# passes.
#
# The one type with all four terminals, which is what makes it the statement of
# what a vehicle node is. Its Rust is tcspecial/src/node/null/.
# Quoted, both of them: `null` unquoted is YAML's own nothing, and a
# description whose node is nothing describes nothing.
node: "null"
type: "null"
about: Carries both streams through and does nothing to what passes.
payload-sink: true
payload-source: true
moc-sink: true
moc-source: true
