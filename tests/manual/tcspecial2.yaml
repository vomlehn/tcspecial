# The payloads tcsmoc controls and tcssim simulates.
#
# This file describes the payloads themselves: which data handlers exist, how
# tcspecial reaches each one, and how big its packets are. It deliberately says
# nothing about how fast a simulated payload produces them or how the simulator
# divides a packet into segments; those are properties of the simulation rather
# than of the payload, and live in tcspecial2sim.yaml.
#
# The set has two payloads, one of each kind: one that sends of its own accord
# and one that answers a request. Neither takes attributes from a group -- a
# group carries what several payloads share, and these two share only the host
# they are on.
version: "1.0"
description: TCSpecial payload set 2

# What tcspecial itself is configured with for this payload set -- the same
# section a tcspecial.yaml holds. First, because it is about the set as a
# whole rather than about any payload in it.
#
# Where the set's beacons go is read from here, that being the set's own
# business; the rest is carried and checked and not yet read, tcspecial taking
# it from the file TCSPECIAL_CONFIG_PATH names.
#
# Two command links, because what the ground needs in a hurry must never be
# queued behind what it asked for at leisure: a command about the spacecraft --
# ping it, arm it, restart it -- is taken on the command interface, and one
# about a payload -- start it, stop it, ask it for its statistics -- on
# payload_interface.
#
# The protocol is not stated and cannot be: the link between tcspecial and the
# ground is UDP.
tcspecial:
  tcs_cmd:
    recv: 0.0.0.0:4000
    send: 127.0.0.1:4100
  payload_command:
    source_base: 127.0.0.1:4300
    dest_base: 0.0.0.0:4200
  payload_telemetry:
    source_base: 0.0.0.0:6000
    dest_base: 127.0.0.1:6100
  beacon:
    interval: "5 s"
    send: "0.0.0.0:5550"
    recv: "127.0.0.1:5650"
  log:
    directory: /var/log/tcspecial
    segment_size: 65536

payloads:
  # Sends of its own accord: nothing here about timing, since how fast a
  # simulated payload sends is a property of the simulation.
  - name: auto-send
    type: network
    protocol: udp
    payload_interface: localhost:5000
    packet_size: 12
    stale_interval: "3000 ms"

  # Answers a request. The trigger and the rate it goes out at are both
  # flight behaviour -- tcspecial does the sending -- so both are here, and
  # tcspecial2sim.yaml states no interval for this payload at all.
  #
  # TCP rather than UDP because a datagram handler learns where its payload is
  # from the payload's first packet, so it has nowhere to send a trigger until
  # the payload has spoken, which a triggered payload does not do.
  - name: triggered-send
    type: network
    protocol: tcp
    payload_interface: localhost:5003
    packet_size: 12
    mode: triggered
    trigger: '"go\n"'
    packet_interval: "1000 ms"
    stale_interval: "3000 ms"
