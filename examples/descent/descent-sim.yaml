# yaml-language-server: $schema=../../tcslibgs/schema/tcspecial-sim.schema.json

# How tcssim simulates the payloads of descent.ytcs.
#
# The two files are joined by name, and nothing here names a payload that
# file does not have. Only the payloads named here are simulated.
#
# Each simulated payload is joined to the physics model: the radar
# altimeter reports the lander's altitude, the Doppler velocimeter its
# velocity, and the touchdown switch its contact with the ground; the engine
# takes the throttle the vehicle's guidance sends it. So the loop closes through
# tcspecial: the radar's altitude decides the throttle, and the throttle
# decides the altitude.
description: Simulator settings for the payloads of descent.ytcs

# Where tcssim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcssim:
  ready: "127.0.0.1:7911"

# The physics of the descent example's vehicle: a lander over the Moon, and
# the engine that brakes it. The simulated payloads below are joined to its
# terminals by name, with connects.
#
# Two parts, each simulated alone and joined below: the engine is throttled
# and gives out a force and the fuel it burns; the body takes both, falls
# under gravity, loses the mass it burns, and touches down. Its fall is the
# rocket equation's, in closed form, and the moment it reaches the ground,
# which no closed form gives, is found ahead of time and met exactly.
world:
  physics:
    components:
      - type body:
          # A tonne and a half, five hundred metres up and falling at twenty
          # metres a second, in the Moon's gravity: the start of a terminal
          # descent. At full throttle the engine brakes it at not quite one and
          # a half metres a second a second, and holds it at a little over half.
          - component: lander
            altitude: "500 m"
            gravity: "1.62 m/s2"
            mass: "1500 kg"
            velocity: "-20 m/s"

      - type engine:
          # A throttleable engine of four and a half kilonewtons, the size of a
          # small lander's descent engine, with a hundred kilograms of fuel: a
          # half again what the descent burns, which is a margin and not much of
          # one.
          - component: engine
            fuel: "100 kg"
            isp: "311 s"
            thrust: "4500 N"

    connections:
      - from: engine.force
        to: lander.force
      - from: engine.flow
        to: lander.flow

simulated_payloads:
  - type network:
      # Five a second, for the ground: guidance does not take it, a process
      # taking values in one unit and this one's being metres a second.
      - payload: doppler
        connects: lander.velocity
        noise: "0.01 m/s"
        packet_interval: 200 ms
        protocol: udp
        simulate: true

      # Driven and never read: the engine's throttle, as guidance sends it.
      - payload: engine
        connects: engine.throttle
        protocol: udp
        simulate: true

      # Ten readings a second, each with two centimetres of noise, which is
      # what guidance differences into a rate of descent.
      - payload: radar
        connects: lander.altitude
        noise: "0.02 m"
        packet_interval: 100 ms
        protocol: udp
        simulate: true

      # A switch on a landing leg: 1 on the ground, 0 off it. Said again every
      # second, and at once when it changes, which is the moment of touchdown:
      # tcssim waits on the model for it rather than for its next turn.
      - payload: touchdown
        connects: lander.contact
        packet_interval: 1 s
        protocol: udp
        simulate: true
