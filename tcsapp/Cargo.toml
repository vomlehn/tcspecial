[package]
name = "tcsapp"
version = "0.1.0"
edition = "2021"
description = "The file interfaces a tcspecial app node's program is run with"

[dependencies]
# For the two things std does not offer: asking whether a descriptor is open,
# and closing one in the child between the fork and the exec. Everything else
# here -- the socket pairs, the spawning, the reading and writing -- is std.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
