# A program of the vehicle's own that takes readings and answers with commands.
#
# A vehicle node: part of the telemetry and control system itself rather than
# something bolted to the vehicle. It is run with one file interface, on which
# it reads payload data and writes MOC data -- so it takes what travels
# groundward and answers with what travels vehicleward, which is the shape the
# ground link has and the thing an app of this kind stands in for. The
# interfaces and the packets they carry are tcsapp; its Rust is
# tcspecial/src/node/vehicle/app_payload_veh/.
node: app_payload_veh
type: app_payload_veh
about: >
  A program of its own: it reads payload data and writes MOC data.
payload-sink: true
payload-source: false
moc-sink: false
moc-source: true
attributes:
  - name: executable
    required: true
    kind: path
    about: >
      Where the application is. It is started when the configuration is
      loaded, so one that cannot be executed is a fault found on the ground,
      and it is run with this node's name as its first argument. A leading `~`
      and `$HOME` are expanded as a shell would expand them, against the home
      directory of whatever runs the application: so the value is kept as
      written and what it stands for is settled aboard.
  - name: app-payload-arg
    required: true
    about: >
      What the program is told about the payload stream, as the argument after
      the node's name. Required: the arguments are a fixed list, so a node that
      said nothing would shift what the rest of the list means.
  - name: restart
    required: false
    kind: boolean
    about: >
      Whether it is started again when it stops: true or false. A node that
      says nothing is a node left stopped, which is the answer a part of a
      control path wants.
