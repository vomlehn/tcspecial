# yaml-language-server: $schema=../../tcsprotocol/schema/tcspecial-sim.schema.json

description: Simulator settings for memusage.ytcs, which has no payloads to
  simulate

# The run's simulation mode, which tcspecial, tcs-sim and tcs-moc all read
# here: all, every payload a simulated or dummy device, as on a desk with no
# hardware. See "Simulation Modes" in docs/tcspecial-design.rst.
tcspecial:
  simulate: all

# Where tcs-sim answers whether it has made its simulated devices, which
# whatever starts the run asks before it starts tcspecial. A port no other
# example uses, so that two can be run at once.
tcs-sim:
  ready: "127.0.0.26:7913"

# The ping nodes are the vehicle's own: nothing here is a payload, so there
# is nothing to simulate.
simulated_payloads: []
