# Something on a serial line.
#
# A payload: what the vehicle carries this flight. Its readings leave by
# payload-out on their way to the ground, and what asks for them -- a
# trigger, a command -- arrives at moc-in. Its Rust is tcspecial/src/node/payload/serial/.
node: serial
type: serial
about: Something on a serial line.
payload-sink: false
payload-source: true
moc-sink: true
moc-source: false
attributes:
  - name: path
    required: true
    kind: path
    about: >
      The serial line it is reached through: /dev/ttyS0.
  - name: datarate
    required: true
    kind: whole
    about: The line rate, in bits a second.
  - name: byte_length
    required: true
    kind: whole
    about: >
      How many data bits a byte is: 7 or 8.
  - name: stop_bits
    required: true
    about: >
      How many stop bits follow a byte: 1 or 2.
  - name: max_length
    required: true
    kind: whole
    about: >
      The most one read of the line may hold, in bytes: at most 4096. A read
      that fills it ends there.
  - name: parity
    required: false
    about: >
      Which parity the line carries: none, even or odd.
  - name: read_timeout
    required: false
    kind: timeout
    about: >
      How long after its first byte a read ends with what has arrived: 250 ms,
      or none. With a length_prefix, a frame still short when it runs out is
      let go instead, and the next byte read as a prefix. A line says this,
      terminators or length_prefix, and none alone means max_length bytes at a
      time.
  - name: terminators
    required: false
    about: >
      Bytes that each end a read, and are its last byte: "0x0D, 0x0A". Not
      beside a length_prefix.
  - name: length_prefix
    required: false
    about: >
      What a read's first bytes say its length is, counting the bytes after
      them: u8, or u16be or u16le for two bytes with the more or the less
      significant first. The read is delivered prefix and all. Needs a
      read_timeout, which may be none.
  - name: group
    required: false
    about: >
      The payload group that reads it, where it is in one. Optional, though a
      payload that states a trigger needs one: the interval of its group is
      how often it is asked.
  - name: trigger
    required: false
    kind: bytes
    about: >
      What to send to make it answer, as hex bytes. A payload with none
      is one the configuration describes as only read.
  - name: trigger_interval
    required: false
    kind: interval
    about: >
      How often the trigger goes out, which is how often this payload is
      asked: 500 ms, 3 s. Said by a payload that has a trigger and is in no
      group; a payload in one is asked when its group is read.
  - name: read_delay
    required: false
    kind: interval
    about: >
      How long to wait between asking and reading, which is what the part
      takes to answer: 2 ms, 200 us. With one, a pass asks, waits and reads
      the answer to the question it asked; with none, a pass reads what the
      last ask produced and asks again. Only beside a trigger.
  - name: poll_interval
    required: false
    kind: interval
    about: >
      The least time between one read of it and the next, for a payload
      nothing asks: 1 s, 500 ms. A floor rather than a rate -- nothing says
      how soon there will be anything to read -- said by a payload with no
      trigger that is in no group, and never beside a trigger.
  - name: init
    required: false
    kind: bytes
    about: >
      What to write to it as the vehicle opens it -- at startup, and whenever
      the ground starts it again -- written as a trigger is: hex for one
      byte, a C string for several. A heater that must start off, a register
      to set before the part reads sensibly. A write that fails stops the
      node from starting.
