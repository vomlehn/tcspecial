[package]
name = "tcslib"
version = "0.1.0"
edition = "2021"
description = "The ground side of the TCSpecial link: commands to the vehicle's command interpreter, the vehicle's data from a moc node, and its beacons"

[dependencies]
tcslibgs = { path = "../tcslibgs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
#log = "0.4"

[dev-dependencies]
tempfile = "3"
