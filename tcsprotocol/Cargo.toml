[package]
name = "tcsprotocol"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = """\
TCS Link Support, what TCSpecial's ground and vehicle software share: the \
command and telemetry protocol, and how every configuration file is read and \
checked"""

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
serde_norway = "0.9.42"
quick-xml = { version = "0.42", features = ["serialize"] }
md5 = "0.8"
# Packs and unpacks the commands and answers, from the code tcs-xtce generated
# from xtce/link.xtce. The version is the one the tcs-xtce checkout beside
# this tree, whose generator wrote that code, must be at, as the code calls
# this runtime: see the tcs-xtce target in Makefile.
tcs-xtce = "=0.6.0"
# Writes and reads the count before a string or bytes sent the ground where
# no XTCE decodes it: unsigned LEB128. See link_type::Count.
leb128 = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
